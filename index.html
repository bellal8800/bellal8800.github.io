<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090e"><title>My Profile</title><style>:root{--bg:#08090e;--card:#171a29cc;--text:#f8f8ff;--muted:#969bad;--accent:#9caaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 50% 0,#343b69,#10121d 45%,#08090e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(430px,100%);min-height:700px;padding:22px;border:1px solid #ffffff18;border-radius:42px;background:linear-gradient(145deg,#252a40e8,#0e1019f5);box-shadow:0 30px 100px #0009;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:750}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c0c8ff,#596ff1);font-size:20px}.status{padding:8px 12px;border-radius:999px;background:#62e6a215;border:1px solid #62e6a230;color:#62e6a2;font-size:11px}.screen{text-align:center;margin:65px 0 25px}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.number{margin-top:16px;min-height:48px;font-size:38px;font-weight:700;letter-spacing:.18em}.placeholder{font-size:15px;letter-spacing:0;color:var(--muted);padding-top:14px}.hint{font-size:12px;color:var(--muted);margin-top:8px;height:18px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;justify-items:center}.key{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffffff1b,#ffffff06);border:1px solid #ffffff18;box-shadow:inset 0 1px #ffffff18,0 8px 22px #0003;transition:transform .42s cubic-bezier(.16,1,.3,1),background .25s,box-shadow .25s}.key strong{font-size:25px;font-weight:600}.key small{height:12px;margin-top:4px;font-size:8px;letter-spacing:.16em;color:#9297ab}.key:hover{background:#ffffff20;box-shadow:0 12px 28px #0005,0 0 0 4px #9caaff12}.key:active{transform:scale(.78);background:#9caaff55;box-shadow:0 0 0 8px #9caaff18;transition-duration:.08s}.actions{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:26px}.round,.unlock{width:50px;height:50px;border-radius:50%;border:1px solid #ffffff15;background:#ffffff0b;color:var(--muted);display:grid;place-items:center;transition:transform .35s cubic-bezier(.16,1,.3,1)}.round:active,.unlock:active{transform:scale(.78)}.unlock{width:78px;height:78px;font-size:27px;background:linear-gradient(145deg,#c0c8ff,#596ff1);color:#10152f;box-shadow:0 15px 35px #596ff155}.vault{display:none;text-align:center}.vault.show{display:block;animation:in .65s cubic-bezier(.16,1,.3,1)}.vault-icon{width:82px;height:82px;margin:50px auto 18px;border-radius:28px;display:grid;place-items:center;background:#303a78;font-size:36px}.vault h1{font-size:28px;margin:0 0 8px}.vault p{font-size:12px;color:var(--muted)}.folders{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:25px 0 14px}.folder{padding:20px 12px;text-align:left;border-radius:24px;border:1px solid #ffffff14;background:#ffffff09;color:var(--text);transition:transform .35s cubic-bezier(.16,1,.3,1)}.folder:active{transform:scale(.94)}.folder b{display:block;font-size:29px}.folder strong{display:block;margin-top:12px;font-size:15px}.folder span{font-size:11px;color:var(--muted)}.create{width:100%;padding:17px;border:0;border-radius:22px;background:linear-gradient(145deg,#aab6ff,#596ff1);color:#11152e;font-weight:750;transition:transform .35s}.create:active{transform:scale(.96)}.lock{margin-top:22px;padding:11px 17px;border-radius:999px;border:1px solid #ffffff14;background:#ffffff09;color:var(--muted)}.footer{text-align:center;color:#666b7d;font-size:10px;margin-top:30px}.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:370px){.key{width:68px;height:68px}.dial{gap:11px}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="avatar">👤</div><span>My Profile</span></div><div class="status" id="status">● Locked</div></header><section id="lock"><div class="screen"><div class="eyebrow">Private access</div><div id="number" class="number placeholder">Enter passcode</div><div id="hint" class="hint">Use the keypad to unlock</div></div><div class="dial"><button class="key" data-k="1"><strong>1</strong><small></small></button><button class="key" data-k="2"><strong>2</strong><small>ABC</small></button><button class="key" data-k="3"><strong>3</strong><small>DEF</small></button><button class="key" data-k="4"><strong>4</strong><small>GHI</small></button><button class="key" data-k="5"><strong>5</strong><small>JKL</small></button><button class="key" data-k="6"><strong>6</strong><small>MNO</small></button><button class="key" data-k="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-k="8"><strong>8</strong><small>TUV</small></button><button class="key" data-k="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-k="*"><strong>*</strong><small></small></button><button class="key" data-k="0"><strong>0</strong><small>+</small></button><button class="key" data-k="#"><strong>#</strong><small></small></button></div><div class="actions"><button class="round" id="back">⌫</button><button class="unlock" id="go">🔓</button><button class="round" id="clear">C</button></div></section><section id="vault" class="vault"><div class="vault-icon">🗂️</div><h1>My Private Files</h1><p>Organize your important files in folders.</p><div class="folders"><button class="folder"><b>🪪</b><strong>NID</strong><span>Identity documents</span></button><button class="folder"><b>📁</b><strong>Document</strong><span>Personal documents</span></button></div><button class="create" id="create">＋ Create new file</button><input id="file" type="file" multiple hidden><button class="lock" id="again">🔒 Lock vault</button></section><div class="footer">Private access · Designed with care</div></main><script>let code='';const pass='193720',n=document.getElementById('number'),hint=document.getElementById('hint'),lock=document.getElementById('lock'),vault=document.getElementById('vault'),file=document.getElementById('file');function draw(){n.textContent=code?'•'.repeat(code.length):'Enter passcode';n.classList.toggle('placeholder',!code);hint.textContent=code?'Press unlock':'Use the keypad to unlock'}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(code.length<12){code+=b.dataset.k;draw()}});document.getElementById('back').onclick=()=>{code=code.slice(0,-1);draw()};document.getElementById('clear').onclick=()=>{code='';draw()};document.getElementById('go').onclick=()=>{if(code===pass){lock.classList.add('hidden');vault.classList.add('show');document.getElementById('status').textContent='● Unlocked'}else{hint.textContent='Incorrect passcode';lock.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:300});setTimeout(draw,700)}};document.getElementById('create').onclick=()=>file.click();document.getElementById('again').onclick=()=>{vault.classList.remove('show');vault.classList.add('hidden');lock.classList.remove('hidden');code='';document.getElementById('status').textContent='● Locked';draw()};draw();</script></body></html>
