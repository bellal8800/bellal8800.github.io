<style id="ios18-animation">

@keyframes springIn{0%{opacity:0;transform:scale(.94) translateY(18px)}55%{opacity:1;transform:scale(1.012) translateY(-2px)}100%{opacity:1;transform:none}}

<style id="oneui9-style">
/* One UI 9 inspired: soft surfaces, restrained depth, and focused blur only for overlays. */
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --secondary:#74777c;
  --text:#17181a;
  --line:#e4e7eb;
  --gray:#eef0f3;
  --shadow:0 4px 16px rgba(0,0,0,.055);
}
body.dark{
  --bg:#101114;
  --card:#1b1d21;
  --secondary:#a4a7ad;
  --text:#f7f7f8;
  --line:#303238;
  --gray:#272a2f;
  --shadow:0 5px 18px rgba(0,0,0,.22);
}
body{background:var(--bg);}
.navbar{background:var(--bg);border-bottom:0;}
.circle-button,.folder-card,.file-row,.trash-row,.lock-avatar,.key,.cancel-action,.action-box,.sheet{
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.folder-card,.file-row,.trash-row{border-radius:22px;}
.search,.sheet-input,.file-icon,.file-button,.handle,.trash-empty-btn,.trash-action{background:var(--gray);}
.search{border-radius:16px;}
.fab{box-shadow:0 8px 22px rgba(0,122,255,.22);}

/* One UI-style background depth: blur only when an overlay is actually open. */
.overlay{
  background:rgba(18,20,24,.24);
  -webkit-backdrop-filter:blur(18px) saturate(115%);
  backdrop-filter:blur(18px) saturate(115%);
}
body:not(.dark) .overlay{background:rgba(255,255,255,.38);}
body.dark .overlay{background:rgba(0,0,0,.42);}
.sheet{
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(120%);
  backdrop-filter:blur(24px) saturate(120%);
  border-bottom:0;
  border-radius:28px 28px 0 0;
}
.action-box,.cancel-action{
  background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(120%);
  backdrop-filter:blur(22px) saturate(120%);
}
.action-item{background:transparent;}

/* Softer One UI-like interaction feedback. */
.key:active,.circle-button:active,.file-button:active,.fab:active{transform:scale(.90);}
.folder-card:active{transform:scale(.975);}
.file-row:active{transform:scale(.992);}
</style>

<script>
const PASSCODE="193720";let pin="",currentPath=[],modalMode="",selectedFolderId=null,data={folders:[],files:[]},fileDB=null,trashView=false;
function initDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open("MyProfileFiles",1);request.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files",{keyPath:"id"})};request.onsuccess=e=>{fileDB=e.target.result;resolve()};request.onerror=()=>reject(request.error)})}
async function startApp(){loadTheme();loadData();createDefaultFolders();try{await initDB()}catch(e){console.log(e)}}startApp();
function loadData(){const saved=localStorage.getItem("myProfileData");if(saved){try{data=JSON.parse(saved)}catch(e){data={folders:[],files:[]}}}if(!data.folders)data.folders=[];if(!data.files)data.files=[]}
function saveData(){localStorage.setItem("myProfileData",JSON.stringify(data))}function createDefaultFolders(){if(data.folders.length)return;data.folders=[{id:makeId(),name:"My Folder",parent:null},{id:makeId(),name:"My Info",parent:null},{id:makeId(),name:"My Personal Data",parent:null}];saveData()}
function makeId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function pressKey(v){if(pin.length>=6)return;pin+=v;updateDots();if(navigator.vibrate)navigator.vibrate(8);if(pin.length===6)setTimeout(checkPin,120)}function backspace(){if(!pin.length)return;pin=pin.slice(0,-1);updateDots()}
function updateDots(){document.querySelectorAll(".pin-dot").forEach((d,i)=>d.classList.toggle("active",i<pin.length))}
function checkPin(){const error=document.getElementById("lockError");if(pin===PASSCODE){error.textContent="";unlock()}else{error.textContent="Incorrect passcode";const dots=document.getElementById("pinDots");dots.classList.add("shake");if(navigator.vibrate)navigator.vibrate([20,40,20]);setTimeout(()=>{dots.classList.remove("shake");pin="";updateDots()},550)}}
function unlock(){const lock=document.getElementById("lockScreen");lock.classList.add("unlocking");setTimeout(()=>{lock.classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("fab").classList.remove("hidden");render()},520)}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("myProfileDark",document.body.classList.contains("dark"))}function loadTheme(){if(localStorage.getItem("myProfileDark")==="true")document.body.classList.add("dark")}
function getCurrentFolder(){if(!currentPath.length)return null;return data.folders.find(f=>f.id===currentPath[currentPath.length-1])||null}
function render(){const folderGrid=document.getElementById("folderGrid"),fileList=document.getElementById("fileList"),search=document.getElementById("searchInput").value.toLowerCase().trim(),currentFolder=getCurrentFolder(),parent=currentFolder?currentFolder.id:null;let folders=data.folders.filter(f=>f.parent===parent&&!f.trashed),files=data.files.filter(f=>f.parent===parent&&!f.trashed);if(search){folders=data.folders.filter(f=>!f.trashed&&f.name.toLowerCase().includes(search));files=data.files.filter(f=>!f.trashed&&f.name.toLowerCase().includes(search))}document.getElementById("location").textContent=currentFolder?currentFolder.name:"My Profile";document.getElementById("backButton").classList.toggle("hidden",!currentPath.length);document.getElementById("folderCount").textContent=folders.length?folders.length+" items":"";document.getElementById("fileCount").textContent=files.length?files.length+" files":"";folderGrid.innerHTML="";
folders.forEach((folder,index)=>{const card=document.createElement("div");card.className="folder-card";card.style.animationDelay=Math.min(index*.045,.25)+"s";card.innerHTML=`<button class="more-button" aria-label="Folder menu">⋯</button><div class="folder-open"><div class="folder-icon">📁</div><div class="folder-name">${escapeHTML(folder.name)}</div><div class="folder-meta">Folder</div></div>`;card.querySelector(".more-button").onclick=e=>openFolderMenu(e,folder.id);card.querySelector(".folder-open").onclick=()=>openFolder(folder.id);folderGrid.appendChild(card)});
fileList.innerHTML="";if(!files.length){fileList.innerHTML='<div class="empty"><div class="empty-icon">📄</div>No files here</div>'}else files.forEach((file,index)=>{const row=document.createElement("div");row.className="file-row";row.style.animationDelay=Math.min(index*.04,.2)+"s";const isImage=/\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)||String(file.type||"").startsWith("image/");const iconHTML=isImage?`<div class="file-icon"><img class="image-file-thumb" alt="" src="${file.previewUrl||""}"></div>`:`<div class="file-icon">${getFileIcon(file.name)}</div>`;row.innerHTML=`${iconHTML}<div class="file-info"><div class="file-name">${escapeHTML(file.name)}</div><div class="file-size">${formatBytes(file.size)}</div></div><button class="file-button download-btn" aria-label="Download">↓</button><button class="file-button delete-btn" aria-label="Delete">🗑</button>`;if(isImage){getBlob(file.id).then(blob=>{const img=row.querySelector(".image-file-thumb");if(img){img.src=URL.createObjectURL(blob);img.onload=()=>URL.revokeObjectURL(img.src)}}).catch(()=>{})}row.querySelector(".file-icon").onclick=()=>openFile(file.id);row.querySelector(".file-info").onclick=()=>openFile(file.id);row.querySelector(".download-btn").onclick=()=>downloadFile(file.id);row.querySelector(".delete-btn").onclick=()=>deleteFile(file.id);
if(/\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
  row.style.cursor='pointer';
  row.addEventListener('click',e=>{if(e.target.closest('button'))return;openImagePreviewDirect(file.id)});
}fileList.appendChild(row)})}
function openFolder(id){currentPath.push(id);document.getElementById("searchInput").value="";render();window.scrollTo({top:0,behavior:"smooth"})}function goBack(){currentPath.pop();render();window.scrollTo({top:0,behavior:"smooth"})}
function showAddMenu(){document.getElementById("actionMenu").classList.remove("hidden")}function hideActionMenu(){document.getElementById("actionMenu").classList.add("hidden")}
function createFolder(){hideActionMenu();modalMode="create";document.getElementById("modalTitle").textContent="New Folder";document.getElementById("modalInput").value="";document.getElementById("modalInput").placeholder="Folder name";document.getElementById("modalConfirm").textContent="Create";document.getElementById("modal").classList.remove("hidden");setTimeout(()=>document.getElementById("modalInput").focus(),180)}
function openFolderMenu(event,id){event.stopPropagation();selectedFolderId=id;document.getElementById("folderMenu").classList.remove("hidden")}function hideFolderMenu(){document.getElementById("folderMenu").classList.add("hidden")}
function renameFolder(){hideFolderMenu();const folder=data.folders.find(f=>f.id===selectedFolderId);if(!folder)return;modalMode="rename";document.getElementById("modalTitle").textContent="Rename Folder";document.getElementById("modalInput").value=folder.name;document.getElementById("modalConfirm").textContent="Save";document.getElementById("modal").classList.remove("hidden");setTimeout(()=>document.getElementById("modalInput").focus(),120)}
function deleteFolder(){hideFolderMenu();moveFolderToTrash(selectedFolderId)}
function removeFolderRecursive(id){const children=data.folders.filter(f=>f.parent===id);children.forEach(c=>removeFolderRecursive(c.id));data.folders=data.folders.filter(f=>f.id!==id);data.files=data.files.filter(f=>f.parent!==id)}
function confirmModal(){const input=document.getElementById("modalInput"),name=input.value.trim();if(!name){showToast("Please enter a name");return}if(modalMode==="create"){data.folders.push({id:makeId(),name,parent:currentPath.length?currentPath[currentPath.length-1]:null});showToast("Folder created")}else if(modalMode==="rename"){const folder=data.folders.find(f=>f.id===selectedFolderId);if(folder)folder.name=name;showToast("Folder renamed")}saveData();hideModal();render()}
function hideModal(){document.getElementById("modal").classList.add("hidden")}function closeModal(event){if(event.target===document.getElementById("modal"))hideModal()}
function uploadFile(){hideActionMenu();const input=document.createElement("input");input.type="file";input.accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp,.gif,image/*";input.multiple=true;input.onchange=async()=>{const files=Array.from(input.files||[]);if(!files.length)return;let count=0;try{const parent=currentPath.length?currentPath[currentPath.length-1]:null;for(const file of files){const id=makeId();await saveBlob(id,file);data.files.push({id,name:file.name,size:file.size,type:file.type,parent,created:Date.now()});count++}saveData();render();showToast(count+(count===1?" file":" files")+" uploaded")}catch(e){console.error(e);saveData();render();showToast("Could not save file")}};input.click()}
function saveBlob(id,file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error("No file"));if(!fileDB)return reject(new Error("Database unavailable"));const tx=fileDB.transaction("files","readwrite");tx.objectStore("files").put({id,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function getBlob(id){return new Promise((resolve,reject)=>{if(!fileDB)return reject(new Error("Database unavailable"));const tx=fileDB.transaction("files","readonly"),req=tx.objectStore("files").get(id);req.onsuccess=()=>req.result?resolve(req.result.blob):reject(new Error("File not found"));req.onerror=()=>reject(req.error)})}
async function openFile(id){
  const file=data.files.find(f=>f.id===id);
  if(!file||file.trashed)return;
  if(/\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
    openImagePreviewDirect(id);
    return;
  }
  try{
    const blob=await getBlob(id),url=URL.createObjectURL(blob);
    window.open(url,"_blank");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){showToast("File not found")}
}
async function downloadFile(id){const file=data.files.find(f=>f.id===id);if(!file)return;try{const blob=await getBlob(id),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=file.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("Download started")}catch(e){showToast("File not found")}}
function deleteFile(id){moveFileToTrash(id)}
function getFileIcon(name){const lower=name.toLowerCase();if(/\.(jpg|jpeg|png|webp|gif)$/i.test(lower))return"🖼️";if(/\.(xls|xlsx)$/i.test(lower))return"📊";return lower.endsWith(".pdf")?"📕":lower.endsWith(".doc")||lower.endsWith(".docx")?"📘":"📄"}function formatBytes(bytes){if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";return(bytes/(1024*1024)).toFixed(1)+" MB"}function escapeHTML(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
let toastTimer;function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1900)}

/* ===== Trash System ===== */
function openTrash(){trashView=true;currentPath=[];document.getElementById("searchInput").value="";renderTrash();window.scrollTo({top:0,behavior:"smooth"})}
function closeTrash(){trashView=false;currentPath=[];render();window.scrollTo({top:0,behavior:"smooth"})}
function trashFolders(){return data.folders.filter(f=>f.trashed)}
function trashFiles(){return data.files.filter(f=>f.trashed)}
function markFolderTrash(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;folder.trashed=true;folder.trashedAt=Date.now();data.folders.filter(f=>f.parent===id).forEach(c=>markFolderTrash(c.id));data.files.filter(f=>f.parent===id).forEach(f=>{f.trashed=true;f.trashedAt=Date.now()})}
function moveFolderToTrash(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;if(!confirm('Move "'+folder.name+'" to Trash?'))return;markFolderTrash(id);saveData();render();showToast('Moved to Trash')}
function markFileTrash(id){const f=data.files.find(x=>x.id===id);if(f){f.trashed=true;f.trashedAt=Date.now()}}
function moveFileToTrash(id){const file=data.files.find(f=>f.id===id);if(!file)return;if(!confirm('Move "'+file.name+'" to Trash?'))return;markFileTrash(id);saveData();render();showToast('Moved to Trash')}
async function deleteBlob(id){if(!fileDB)return;await new Promise(resolve=>{try{const tx=fileDB.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve}catch(e){resolve()}})}
function restoreFolder(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;folder.trashed=false;delete folder.trashedAt;data.folders.filter(f=>f.parent===id).forEach(c=>{if(c.trashed)restoreFolder(c.id)});data.files.filter(f=>f.parent===id).forEach(f=>{f.trashed=false;delete f.trashedAt});saveData();renderTrash();showToast('Folder restored')}
function restoreFile(id){const f=data.files.find(x=>x.id===id);if(!f)return;f.trashed=false;delete f.trashedAt;saveData();renderTrash();showToast('File restored')}
async function permanentDeleteFile(id){const file=data.files.find(f=>f.id===id);if(!file)return;if(!confirm('Delete "'+file.name+'" permanently?'))return;await deleteBlob(id);data.files=data.files.filter(f=>f.id!==id);saveData();renderTrash();showToast('Deleted permanently')}
async function permanentDeleteFolder(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;if(!confirm('Delete this folder and everything inside it permanently?'))return;const folderIds=[];const collect=(fid)=>{folderIds.push(fid);data.folders.filter(f=>f.parent===fid).forEach(c=>collect(c.id))};collect(id);const fileIds=data.files.filter(f=>folderIds.includes(f.parent)).map(f=>f.id);for(const fid of fileIds)await deleteBlob(fid);data.files=data.files.filter(f=>!folderIds.includes(f.parent));data.folders=data.folders.filter(f=>!folderIds.includes(f.id));saveData();renderTrash();showToast('Folder deleted permanently')}
async function emptyTrash(){const tf=trashFiles(),td=trashFolders();if(!tf.length&&!td.length){showToast('Trash is empty');return}if(!confirm('Empty Trash permanently? This cannot be undone.'))return;for(const f of tf)await deleteBlob(f.id);data.files=data.files.filter(f=>!f.trashed);data.folders=data.folders.filter(f=>!f.trashed);saveData();renderTrash();showToast('Trash emptied')}
function renderTrash(){const folderGrid=document.getElementById('folderGrid'),fileList=document.getElementById('fileList');const folders=trashFolders().filter(f=>!f.parent||data.folders.find(p=>p.id===f.parent&&!p.trashed));const files=trashFiles().filter(f=>!data.folders.find(p=>p.id===f.parent&&p.trashed));document.getElementById('location').textContent='Trash';document.getElementById('backButton').classList.remove('hidden');document.getElementById('backButton').textContent='←';document.getElementById('backButton').onclick=closeTrash;document.getElementById('folderCount').innerHTML='<button class="trash-empty-btn" onclick="emptyTrash()">Empty Trash</button>';document.getElementById('fileCount').textContent=(folders.length+files.length)?(folders.length+files.length)+' items':'';folderGrid.innerHTML='';fileList.innerHTML='';if(!folders.length)folderGrid.innerHTML='<div class="empty"><div class="empty-icon">🗑️</div>No folders in Trash</div>';folders.forEach((folder,index)=>{const card=document.createElement('div');card.className='trash-row';card.style.animationDelay=Math.min(index*.04,.2)+'s';card.innerHTML='<div class="file-icon">📁</div><div class="trash-info"><div class="trash-name">'+escapeHTML(folder.name)+'</div><div class="trash-meta">Folder • Trash</div></div><div class="trash-actions"><button class="trash-action" onclick="restoreFolder(\''+folder.id+'\')" aria-label="Restore">↩</button><button class="trash-action danger" onclick="permanentDeleteFolder(\''+folder.id+'\')" aria-label="Delete permanently">🗑</button></div>';folderGrid.appendChild(card)});if(!files.length)fileList.innerHTML='<div class="empty"><div class="empty-icon">📄</div>No files in Trash</div>';files.forEach((file,index)=>{const row=document.createElement('div');row.className='trash-row';row.style.animationDelay=Math.min(index*.04,.2)+'s';row.innerHTML='<div class="file-icon">'+getFileIcon(file.name)+'</div><div class="trash-info"><div class="trash-name">'+escapeHTML(file.name)+'</div><div class="trash-meta">'+formatBytes(file.size)+' • Trash</div></div><div class="trash-actions"><button class="trash-action" onclick="restoreFile(\''+file.id+'\')" aria-label="Restore">↩</button><button class="trash-action danger" onclick="permanentDeleteFile(\''+file.id+'\')" aria-label="Delete permanently">🗑</button></div>';fileList.appendChild(row)})}
</script>

<style id="image-preview-final">
.image-preview-final{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:18px;animation:fadeIn .2s ease}
.image-preview-final img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:14px}
.image-preview-final-close{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;z-index:2}
</style>
<script id="image-preview-final-js">
async function openImagePreviewFinal(id){
  try{
    const file=data.files.find(f=>f.id===id);
    if(!file||file.trashed)return;
    const blob=await loadBlob(id);
    if(!blob){showToast('Image not found');return;}
    const old=document.getElementById('imagePreviewFinal');
    if(old)old.remove();
    const url=URL.createObjectURL(blob);
    const box=document.createElement('div');
    box.id='imagePreviewFinal';
    box.className='image-preview-final';
    const close=document.createElement('button');
    close.className='image-preview-final-close';
    close.type='button';
    close.textContent='×';
    close.setAttribute('aria-label','Close');
    const img=document.createElement('img');
    img.src=url;
    img.alt=file.name;
    const closePreview=()=>{URL.revokeObjectURL(url);box.remove()};
    close.onclick=closePreview;
    box.onclick=e=>{if(e.target===box)closePreview()};
    box.appendChild(close);
    box.appendChild(img);
    document.body.appendChild(box);
  }catch(e){console.error(e);showToast('Could not open image')}
}
</script>

<style id="image-preview-direct-style">
.image-preview-direct{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:18px;animation:fadeIn .2s ease}
.image-preview-direct img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:14px}
.image-preview-direct-close{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;z-index:2}
</style>
<script id="image-preview-direct-js">
async function openImagePreviewDirect(id){
  try{
    const file=data.files.find(f=>f.id===id);
    if(!file||file.trashed)return;
    const blob=await getBlob(id);
    if(!blob){showToast("Image not found");return;}
    const old=document.getElementById("imagePreviewDirect");
    if(old){if(old.dataset.url)URL.revokeObjectURL(old.dataset.url);old.remove()}
    const url=URL.createObjectURL(blob);
    const box=document.createElement("div");
    box.id="imagePreviewDirect";
    box.className="image-preview-direct";
    box.dataset.url=url;
    const close=document.createElement("button");
    close.className="image-preview-direct-close";
    close.type="button";
    close.setAttribute("aria-label","Close");
    close.textContent="×";
    const img=document.createElement("img");
    img.src=url;
    img.alt=file.name;
    const closePreview=()=>{URL.revokeObjectURL(url);box.remove()};
    close.onclick=closePreview;
    box.onclick=e=>{if(e.target===box)closePreview()};
    box.appendChild(close);
    box.appendChild(img);
    document.body.appendChild(box);
  }catch(e){console.error(e);showToast("Could not open image")}
}
</script>
