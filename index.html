<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Bellal Vault</title>
<style>
:root{--bg:#080d18;--panel:#111b2e;--text:#f8fbff;--muted:#91a0b8;--line:#ffffff18;--green:#35e59a;--red:#ff5e73;--blue:#6c8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#1b3159,#080d18 55%,#05070c);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(430px,100%);background:linear-gradient(160deg,#162239f2,#080e1af7);border:1px solid var(--line);border-radius:34px;padding:22px 20px 25px;box-shadow:0 30px 90px #0008}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:800;display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#7c91ff,#4565e8);display:grid;place-items:center}.status{font-size:11px;color:var(--green);background:#35e59a14;border:1px solid #35e59a33;padding:7px 10px;border-radius:99px}.screen{text-align:center;margin:48px 0 26px}.label{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.number{min-height:52px;margin-top:14px;font-size:clamp(27px,8vw,38px);font-weight:750;letter-spacing:.04em;word-break:break-all}.hint{height:22px;color:var(--muted);font-size:13px;margin-top:8px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:25px 6px 22px}.key{height:76px;border-radius:23px;background:#ffffff0e;border:1px solid #ffffff12;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.12s}.key:active{transform:scale(.91);background:#ffffff20}.key strong{font-size:26px}.key small{font-size:9px;color:var(--muted);height:13px;margin-top:5px;letter-spacing:.13em}.actions{display:flex;align-items:center;justify-content:center;gap:24px}.call{width:72px;height:72px;border:0;border-radius:50%;background:linear-gradient(145deg,var(--green),#1bbf7a);color:#052319;font-size:28px;cursor:pointer}.call.end{background:linear-gradient(145deg,#ff7788,#e33d58);color:#fff}.side-action{width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.footer{text-align:center;color:#64738d;font-size:11px;margin-top:25px}.toast{margin-top:18px;background:#18263d;border:1px solid #ffffff14;border-radius:16px;padding:13px;text-align:center;font-size:13px;display:none}.toast.show{display:block}.vault{display:none;text-align:center;padding:50px 10px 35px}.vault.show{display:block}.vault h1{font-size:28px}.vault p{color:var(--muted)}.hidden{display:none!important}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">🔐</div><span>Bellal Vault</span></div><div class="status" id="status">● Locked</div></header>
<section id="lockScreen"><section class="screen"><div class="label">Enter passcode</div><div class="number" id="number">Enter code</div><div class="hint" id="hint">Use the keypad to unlock</div></section>
<section class="dial" aria-label="Passcode keypad">
<button class="key" data-key="1"><strong>1</strong><small>&nbsp;</small></button><button class="key" data-key="2"><strong>2</strong><small>ABC</small></button><button class="key" data-key="3"><strong>3</strong><small>DEF</small></button><button class="key" data-key="4"><strong>4</strong><small>GHI</small></button><button class="key" data-key="5"><strong>5</strong><small>JKL</small></button><button class="key" data-key="6"><strong>6</strong><small>MNO</small></button><button class="key" data-key="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-key="8"><strong>8</strong><small>TUV</small></button><button class="key" data-key="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-key="*"><strong>*</strong><small>&nbsp;</small></button><button class="key" data-key="0"><strong>0</strong><small>+</small></button><button class="key" data-key="#"><strong>#</strong><small>&nbsp;</small></button>
</section><div class="actions"><button class="side-action" id="backspace" aria-label="Delete">⌫</button><button class="call" id="unlock" aria-label="Unlock">🔓</button><button class="side-action" id="clear" aria-label="Clear">C</button></div></section>
<section class="vault" id="vault"><div style="font-size:58px">🎉</div><h1>Website Unlocked</h1><p>Your private vault is now open.</p><button class="side-action" id="lockAgain">🔒 Lock again</button></section>
<div class="footer">Private access · Enter your passcode</div><div class="toast" id="toast"></div>
</main>
<script>
const PASSCODE='193720';let value='',unlocked=false,timer;const numberEl=document.getElementById('number'),hintEl=document.getElementById('hint'),statusEl=document.getElementById('status'),toast=document.getElementById('toast'),lockScreen=document.getElementById('lockScreen'),vault=document.getElementById('vault'),unlockBtn=document.getElementById('unlock');
function render(){numberEl.textContent=value?value.replace(/./g,'•'):'Enter code';numberEl.style.color=value?'var(--text)':'var(--muted)';hintEl.textContent=value?'Press unlock':'Use the keypad to unlock'}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function add(k){if(!unlocked&&value.length<12){value+=k;render()}}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.key)));
document.getElementById('backspace').onclick=()=>{value=value.slice(0,-1);render()};document.getElementById('clear').onclick=()=>{value='';render()};
unlockBtn.onclick=()=>{if(value===PASSCODE){unlocked=true;lockScreen.classList.add('hidden');vault.classList.add('show');statusEl.textContent='● Unlocked';statusEl.style.color='var(--green)';notify('Unlocked successfully')}else{notify('Wrong passcode');value='';render()}};
document.getElementById('lockAgain').onclick=()=>{unlocked=false;value='';vault.classList.remove('show');lockScreen.classList.remove('hidden');statusEl.textContent='● Locked';statusEl.style.color='var(--green)';render()};
window.addEventListener('keydown',e=>{if(/^[0-9*#]$/.test(e.key))add(e.key);else if(e.key==='Backspace'){value=value.slice(0,-1);render()}else if(e.key==='Escape'){value='';render()}else if(e.key==='Enter')unlockBtn.click()});render();
</script>
</body>
</html>
