<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Bellal Vault</title>
<style>
:root{--bg:#08090d;--card:rgba(28,29,36,.82);--card2:#22232c;--text:#f7f7fb;--muted:#9b9ca8;--line:rgba(255,255,255,.1);--accent:#7c8cff;--green:#35d98b;--red:#ff667c;--shadow:0 25px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(700px 400px at 50% -10%,#30334d 0%,#11121a 42%,#08090d 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;display:grid;place-items:center;padding:18px;letter-spacing:-.01em}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{width:min(440px,100%);min-height:720px;background:linear-gradient(145deg,rgba(34,35,45,.9),rgba(14,15,21,.96));border:1px solid var(--line);border-radius:38px;padding:22px 20px 24px;box-shadow:var(--shadow);overflow:hidden;position:relative;animation:appear .65s cubic-bezier(.2,.8,.2,1)}.app:before{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-100px;background:#7382ff;filter:blur(80px);opacity:.16;pointer-events:none}.top,.brand,.status,.actions,.file-head{display:flex;align-items:center}.top{justify-content:space-between;position:relative}.brand{gap:10px;font-weight:750;font-size:18px}.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,#9aa5ff,#5267ec);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 22px #5d6fff35}.status{gap:5px;font-size:11px;color:var(--green);background:#35d98b12;border:1px solid #35d98b2e;padding:7px 10px;border-radius:99px}.screen{text-align:center;margin:54px 0 26px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}.number{min-height:54px;margin-top:14px;font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:.08em;word-break:break-all}.hint{height:22px;color:var(--muted);font-size:13px;margin-top:8px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 5px 22px}.key{height:72px;border-radius:24px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .16s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s;user-select:none;-webkit-tap-highlight-color:transparent}.key strong{font-size:25px;font-weight:650;line-height:1}.key small{font-size:9px;color:var(--muted);height:12px;margin-top:5px;letter-spacing:.14em}.key:hover{background:rgba(255,255,255,.11);border-color:#ffffff20}.key:active{transform:scale(.88);background:#ffffff18}.actions{justify-content:center;gap:25px}.call{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#5eefa6,#20bb76);color:#062719;font-size:27px;box-shadow:0 12px 30px #20c77a35;transition:transform .18s,filter .2s}.call:active{transform:scale(.88)}.side-action{width:46px;height:46px;border-radius:50%;background:transparent;color:var(--muted);font-size:21px;transition:.2s}.side-action:hover{background:#ffffff0b;color:var(--text)}.footer{text-align:center;color:#686a79;font-size:11px;margin-top:28px}.toast{position:absolute;left:20px;right:20px;bottom:18px;background:#292b38;border:1px solid #ffffff15;border-radius:17px;padding:13px;text-align:center;font-size:13px;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:translateY(0)}.hidden{display:none!important}
.vault{display:none;animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}.vault.show{display:block}.vault-head{text-align:center;margin:38px 0 25px}.vault-icon{font-size:54px;margin-bottom:12px}.vault h1{font-size:28px;margin:0 0 8px}.vault p{color:var(--muted);font-size:13px;margin:0}.upload{display:block;text-align:center;padding:19px;border-radius:22px;background:linear-gradient(145deg,#7d8cff,#586ce9);font-weight:700;box-shadow:0 12px 25px #586ce930;transition:transform .18s,filter .2s}.upload:active{transform:scale(.96);filter:brightness(.9)}#fileInput{display:none}.file-list{margin-top:18px;display:flex;flex-direction:column;gap:10px;max-height:260px;overflow:auto}.empty{padding:28px 15px;text-align:center;color:var(--muted);background:#ffffff06;border:1px dashed #ffffff16;border-radius:20px;font-size:13px}.file{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff0d;animation:slideUp .3s ease}.file-icon{width:40px;height:40px;border-radius:13px;background:#7c8cff18;color:#aab3ff;display:grid;place-items:center;font-size:19px;flex:none}.file-info{min-width:0;flex:1}.file-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{font-size:11px;color:var(--muted);margin-top:4px}.file-actions{display:flex;gap:5px}.mini{width:32px;height:32px;border-radius:11px;background:#ffffff0b;color:var(--muted);font-size:14px}.mini:hover{color:var(--text);background:#ffffff15}.vault-bottom{display:flex;justify-content:center;margin-top:22px}.lock{font-size:12px;color:var(--muted);background:#ffffff08;border:1px solid #ffffff10;padding:10px 15px;border-radius:99px}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-height:700px){.app{min-height:auto}.screen{margin:30px 0 18px}.key{height:62px}.dial{gap:9px;margin:18px 5px}}
</style>
</head>
<body>
<main class="app" aria-label="Bellal Vault">
<header class="top"><div class="brand"><div class="logo">🔐</div><span>Bellal Vault</span></div><div class="status" id="status">● Locked</div></header>
<section id="lockScreen"><section class="screen"><div class="label">Enter passcode</div><div class="number" id="number">Enter code</div><div class="hint" id="hint">Use the keypad to unlock</div></section>
<section class="dial" aria-label="Passcode keypad">
<button class="key" data-key="1"><strong>1</strong><small>&nbsp;</small></button><button class="key" data-key="2"><strong>2</strong><small>ABC</small></button><button class="key" data-key="3"><strong>3</strong><small>DEF</small></button><button class="key" data-key="4"><strong>4</strong><small>GHI</small></button><button class="key" data-key="5"><strong>5</strong><small>JKL</small></button><button class="key" data-key="6"><strong>6</strong><small>MNO</small></button><button class="key" data-key="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-key="8"><strong>8</strong><small>TUV</small></button><button class="key" data-key="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-key="*"><strong>*</strong><small>&nbsp;</small></button><button class="key" data-key="0"><strong>0</strong><small>+</small></button><button class="key" data-key="#"><strong>#</strong><small>&nbsp;</small></button>
</section><div class="actions"><button class="side-action" id="backspace" aria-label="Delete">⌫</button><button class="call" id="unlock" aria-label="Unlock">🔓</button><button class="side-action" id="clear" aria-label="Clear">C</button></div></section>
<section class="vault" id="vault"><div class="vault-head"><div class="vault-icon">🗂️</div><h1>My Private Vault</h1><p>Your files are stored in this browser.</p></div><label class="upload" for="fileInput">＋ Add files<input id="fileInput" type="file" multiple></label><div class="file-list" id="fileList"></div><div class="vault-bottom"><button class="lock" id="lockAgain">🔒 Lock vault</button></div></section>
<div class="footer">Private access · Smooth and secure interface</div><div class="toast" id="toast"></div>
</main>
<script>
const PASSCODE='193720';let value='',unlocked=false,timer;const $=id=>document.getElementById(id);const numberEl=$('number'),hintEl=$('hint'),statusEl=$('status'),toast=$('toast'),lockScreen=$('lockScreen'),vault=$('vault'),unlockBtn=$('unlock'),fileInput=$('fileInput'),fileList=$('fileList');
function render(){numberEl.textContent=value?value.replace(/./g,'•'):'Enter code';numberEl.style.color=value?'var(--text)':'var(--muted)';hintEl.textContent=value?'Press unlock':'Use the keypad to unlock'}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2300)}
function add(k){if(!unlocked&&value.length<12){value+=k;render()}}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.key)));
$('backspace').onclick=()=>{value=value.slice(0,-1);render()};$('clear').onclick=()=>{value='';render()};
function getFiles(){try{return JSON.parse(localStorage.getItem('bellalVaultFiles')||'[]')}catch(e){return[]}}
function saveFiles(files){localStorage.setItem('bellalVaultFiles',JSON.stringify(files))}
function sizeText(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';return (bytes/1048576).toFixed(1)+' MB'}
function renderFiles(){const files=getFiles();if(!files.length){fileList.innerHTML='<div class="empty">No files yet.<br>Add your first file to the vault.</div>';return}fileList.innerHTML=files.map((f,i)=>`<div class="file"><div class="file-icon">📄</div><div class="file-info"><div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div><div class="file-size">${sizeText(f.size)}</div></div><div class="file-actions"><button class="mini" data-download="${i}" aria-label="Download">↓</button><button class="mini" data-delete="${i}" aria-label="Delete">×</button></div></div>`).join('');fileList.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(Number(b.dataset.download)));fileList.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteFile(Number(b.dataset.delete)))}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function downloadFile(i){const f=getFiles()[i];if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function deleteFile(i){const files=getFiles();files.splice(i,1);saveFiles(files);renderFiles();notify('File removed')}
fileInput.onchange=()=>{const selected=[...fileInput.files];if(!selected.length)return;let files=getFiles(),pending=selected.length;selected.forEach(file=>{const reader=new FileReader();reader.onload=()=>{files.push({name:file.name,size:file.size,type:file.type,data:reader.result});pending--;if(!pending){saveFiles(files);renderFiles();notify(selected.length+' file'+(selected.length>1?'s':'')+' added')}};reader.readAsDataURL(file)});fileInput.value=''};
unlockBtn.onclick=()=>{if(value===PASSCODE){unlocked=true;lockScreen.classList.add('hidden');vault.classList.add('show');statusEl.textContent='● Unlocked';statusEl.style.color='var(--green)';renderFiles();notify('Vault unlocked')}else{notify('Wrong passcode');value='';render()}};
$('lockAgain').onclick=()=>{unlocked=false;value='';vault.classList.remove('show');lockScreen.classList.remove('hidden');statusEl.textContent='● Locked';statusEl.style.color='var(--green)';render()};
window.addEventListener('keydown',e=>{if(/^[0-9*#]$/.test(e.key))add(e.key);else if(e.key==='Backspace'){value=value.slice(0,-1);render()}else if(e.key==='Escape'){value='';render()}else if(e.key==='Enter')unlockBtn.click()});render();
</script>
</body>
</html>
