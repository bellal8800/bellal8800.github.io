<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1220" />
<title>Bellal Dial</title>
<style>
:root{--bg:#080d18;--panel:rgba(20,29,48,.82);--panel2:#111b2e;--text:#f8fbff;--muted:#91a0b8;--line:rgba(255,255,255,.09);--green:#35e59a;--green2:#1bbf7a;--red:#ff5e73;--blue:#6c8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#1b3159 0,#0b1220 38%,#070b13 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:18px}button,input{font:inherit}button{border:0;cursor:pointer}.app{width:min(430px,100%);min-height:760px;background:linear-gradient(160deg,rgba(22,34,57,.94),rgba(8,14,26,.97));border:1px solid var(--line);border-radius:34px;box-shadow:0 30px 90px rgba(0,0,0,.4);padding:22px 20px 24px;position:relative;overflow:hidden}.app:before{content:"";position:absolute;width:240px;height:240px;background:#345dff;filter:blur(90px);opacity:.18;top:-100px;right:-80px;pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;position:relative}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#7c91ff,#4565e8);display:grid;place-items:center;box-shadow:0 8px 24px #334fc455}.status{font-size:11px;color:var(--green);background:#35e59a14;border:1px solid #35e59a33;padding:7px 10px;border-radius:99px}.screen{margin:52px 0 28px;text-align:center;position:relative}.label{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.number{min-height:52px;margin-top:14px;font-size:clamp(27px,8vw,38px);font-weight:750;letter-spacing:.04em;word-break:break-all}.hint{height:22px;color:var(--muted);font-size:13px;margin-top:8px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:26px 6px 22px}.key{height:76px;border-radius:23px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,background .2s,border-color .2s;user-select:none}.key strong{font-size:26px;font-weight:650;line-height:1}.key small{font-size:9px;color:var(--muted);height:13px;margin-top:5px;letter-spacing:.13em}.key:hover{background:rgba(255,255,255,.1);border-color:#ffffff22}.key:active{transform:scale(.91);background:#ffffff18}.actions{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:4px}.call{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,var(--green),var(--green2));color:#052319;font-size:28px;box-shadow:0 12px 30px #1acb7a44;transition:transform .15s,box-shadow .2s}.call:active{transform:scale(.9)}.call.end{background:linear-gradient(145deg,#ff7788,#e33d58);color:#fff}.side-action{width:46px;height:46px;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;transition:.2s}.side-action:hover{background:#ffffff0d;color:var(--text)}.footer{text-align:center;color:#64738d;font-size:11px;margin-top:25px}.toast{position:absolute;left:20px;right:20px;bottom:18px;background:#18263d;border:1px solid #ffffff14;border-radius:16px;padding:13px;text-align:center;font-size:13px;transform:translateY(90px);opacity:0;transition:.3s;pointer-events:none}.toast.show{transform:translateY(0);opacity:1}.hidden{display:none!important}@media(max-height:700px){.app{min-height:auto}.screen{margin:30px 0 18px}.key{height:64px}.dial{gap:9px;margin:18px 6px}}
</style>
</head>
<body>
<main class="app" aria-label="Bellal Dial calling interface">
  <header class="top"><div class="brand"><div class="logo">☎</div><span>Bellal Dial</span></div><div class="status" id="status">● Ready</div></header>
  <section class="screen"><div class="label">Phone number</div><div class="number" id="number">Enter number</div><div class="hint" id="hint">Tap the keypad to begin</div></section>
  <section class="dial" aria-label="Dial pad">
    <button class="key" data-key="1"><strong>1</strong><small>&nbsp;</small></button>
    <button class="key" data-key="2"><strong>2</strong><small>ABC</small></button>
    <button class="key" data-key="3"><strong>3</strong><small>DEF</small></button>
    <button class="key" data-key="4"><strong>4</strong><small>GHI</small></button>
    <button class="key" data-key="5"><strong>5</strong><small>JKL</small></button>
    <button class="key" data-key="6"><strong>6</strong><small>MNO</small></button>
    <button class="key" data-key="7"><strong>7</strong><small>PQRS</small></button>
    <button class="key" data-key="8"><strong>8</strong><small>TUV</small></button>
    <button class="key" data-key="9"><strong>9</strong><small>WXYZ</small></button>
    <button class="key" data-key="*"><strong>*</strong><small>&nbsp;</small></button>
    <button class="key" data-key="0"><strong>0</strong><small>+</small></button>
    <button class="key" data-key="#"><strong>#</strong><small>&nbsp;</small></button>
  </section>
  <div class="actions"><button class="side-action" id="backspace" aria-label="Delete last digit">⌫</button><button class="call" id="call" aria-label="Call">☎</button><button class="side-action" id="clear" aria-label="Clear number">C</button></div>
  <div class="footer">Private calling interface · Smooth and simple</div>
  <div class="toast" id="toast"></div>
</main>
<script>
const numberEl=document.getElementById('number'),hintEl=document.getElementById('hint'),statusEl=document.getElementById('status'),callBtn=document.getElementById('call'),toast=document.getElementById('toast');let value='',calling=false,timer;
function render(){numberEl.textContent=value||'Enter number';numberEl.style.color=value?'var(--text)':'var(--muted)';hintEl.textContent=calling?'Calling…':value?'Ready to call':'Tap the keypad to begin'}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}
document.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{if(!calling){value+=btn.dataset.key;render()}}));
document.getElementById('backspace').onclick=()=>{if(!calling){value=value.slice(0,-1);render()}};
document.getElementById('clear').onclick=()=>{if(!calling){value='';render()}};
callBtn.onclick=()=>{if(calling){calling=false;statusEl.textContent='● Ready';statusEl.style.color='var(--green)';callBtn.classList.remove('end');callBtn.textContent='☎';notify('Call ended');render()}else{if(!value){notify('Enter a number first');return}calling=true;statusEl.textContent='● Calling';statusEl.style.color='var(--blue)';callBtn.classList.add('end');callBtn.textContent='■';render();notify('Calling '+value)}};
window.addEventListener('keydown',e=>{if(/^[0-9*#]$/.test(e.key)){if(!calling){value+=e.key;render()}}else if(e.key==='Backspace'){if(!calling){value=value.slice(0,-1);render()}}else if(e.key==='Escape'){if(!calling){value='';render()}}});render();
</script>
</body>
</html>
