<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a10"><title>My Profile</title>
<style>
:root{--bg:#090a10;--text:#f8f9ff;--muted:#9da3b8;--line:#ffffff1f;--accent:#aebaff;--spring:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(80% 55% at 50% 0,#343d78,#171a2a 43%,#090a10);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(430px,100%);min-height:700px;padding:22px;border:1px solid #ffffff26;border-radius:42px;background:linear-gradient(145deg,#2a2f48eb,#0c0e17f5);box-shadow:0 35px 100px #0009,inset 0 1px #fff2;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:760}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d6dcff,#6378f4);font-size:20px}.status{padding:8px 12px;border-radius:999px;background:#62e6a214;border:1px solid #62e6a238;color:#72e8ad;font-size:11px;font-weight:650}.screen{text-align:center;margin:58px 0 22px}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}.number{margin-top:15px;min-height:44px;font-size:34px;font-weight:720;letter-spacing:.18em}.placeholder{font-size:15px;letter-spacing:0;color:var(--muted);padding-top:12px}.hint{font-size:12px;color:var(--muted);margin-top:8px;height:18px}.hint.error{color:#ff9fae}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}.key{width:64px;height:64px;border:1px solid var(--line);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);background:linear-gradient(145deg,#ffffff1b,#ffffff08);box-shadow:inset 0 1px #fff2,0 8px 22px #0004;cursor:pointer;transition:transform .45s var(--spring),background .3s,box-shadow .3s}.key strong{font-size:22px;font-weight:600}.key small{height:11px;margin-top:3px;font-size:7px;letter-spacing:.15em;color:#a1a7bd}.key:hover{transform:translateY(-2px);background:#ffffff22}.key:active,.round:active,.unlock:active,.folder:active,.create:active,.lock:active,.back-folder:active{transform:scale(.86);transition-duration:.08s}.actions{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:22px}.round,.unlock,.folder,.create,.lock,.back-folder{font:inherit;cursor:pointer}.round,.unlock{display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);color:var(--muted);background:#ffffff0d;transition:transform .45s var(--spring),background .25s}.round{width:46px;height:46px}.unlock{width:68px;height:68px;font-size:24px;color:#10152f;background:linear-gradient(145deg,#d0d7ff,#657af3);box-shadow:0 14px 32px #596ff155}.vault{display:none;text-align:center}.vault.show{display:block;animation:appear .7s var(--spring)}.vault-icon{width:78px;height:78px;margin:45px auto 16px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#3b478c,#242c62);font-size:34px}.vault h1{font-size:27px;letter-spacing:-.04em;margin:0 0 8px}.vault p{font-size:12px;color:var(--muted)}.folders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:23px 0 14px}.folder{padding:18px 12px;text-align:left;border-radius:22px;border:1px solid var(--line);background:#ffffff0b;color:var(--text);box-shadow:0 10px 25px #0002;transition:transform .45s var(--spring),background .3s}.folder:hover{transform:translateY(-4px);background:#ffffff16}.folder b{display:block;font-size:27px}.folder strong{display:block;margin-top:10px;font-size:15px}.folder span{font-size:11px;color:var(--muted)}.create{width:100%;padding:16px;border:1px solid #ffffff18;border-radius:20px;background:linear-gradient(145deg,#b9c4ff,#687bf2);color:#11152e;font-weight:750;transition:transform .45s var(--spring)}.file-list{margin-top:15px;text-align:left;display:grid;gap:8px}.file-item{padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#ffffff08;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-view{display:none;text-align:left;animation:appear .55s var(--spring)}.folder-view.show{display:block}.folder-head{display:flex;align-items:center;gap:10px;margin:38px 0 20px}.folder-head h2{margin:0;font-size:25px}.back-folder{border:1px solid var(--line);background:#ffffff0b;color:var(--text);border-radius:14px;padding:9px 12px}.empty{padding:24px 12px;text-align:center;border:1px dashed #ffffff25;border-radius:20px;color:var(--muted);font-size:12px}.lock{margin-top:22px;padding:11px 17px;border-radius:999px;border:1px solid var(--line);background:#ffffff09;color:var(--muted);transition:transform .4s var(--spring)}.footer{text-align:center;color:#6f7488;font-size:10px;margin-top:28px}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@media(max-width:370px){.app{padding:19px;border-radius:34px}.key{width:58px;height:58px}.key strong{font-size:20px}.dial{gap:10px}.screen{margin-top:45px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><div class="avatar">👤</div><span>My Profile</span></div><div class="status" id="status">● Locked</div></header>
<section id="lock"><div class="screen"><div class="eyebrow">Private access</div><div id="number" class="number placeholder">Enter passcode</div><div id="hint" class="hint">Use the keypad to unlock</div></div><div class="dial"><button class="key" data-k="1"><strong>1</strong></button><button class="key" data-k="2"><strong>2</strong><small>ABC</small></button><button class="key" data-k="3"><strong>3</strong><small>DEF</small></button><button class="key" data-k="4"><strong>4</strong><small>GHI</small></button><button class="key" data-k="5"><strong>5</strong><small>JKL</small></button><button class="key" data-k="6"><strong>6</strong><small>MNO</small></button><button class="key" data-k="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-k="8"><strong>8</strong><small>TUV</small></button><button class="key" data-k="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-k="*"><strong>*</strong></button><button class="key" data-k="0"><strong>0</strong><small>+</small></button><button class="key" data-k="#"><strong>#</strong></button></div><div class="actions"><button class="round" id="back">⌫</button><button class="unlock" id="go">🔓</button><button class="round" id="clear">C</button></div></section>
<section id="vault" class="vault"><div id="home"><div class="vault-icon">🗂️</div><h1>My Private Files</h1><p>Organize your important files in folders.</p><div class="folders"><button class="folder" data-folder="NID"><b>🪪</b><strong>NID</strong><span>Identity documents</span></button><button class="folder" data-folder="Documents"><b>📁</b><strong>Documents</strong><span>Personal documents</span></button></div><button class="create" id="create">＋ Create new file</button><input id="file" type="file" multiple hidden><div id="fileList" class="file-list"></div></div><div id="folderView" class="folder-view"><div class="folder-head"><button class="back-folder" id="backFolder">‹ Back</button><h2 id="folderTitle"></h2></div><div id="folderFiles" class="empty">এই folder এখনো খালি।<br>＋ Create new file চাপলে ফাইল যোগ হবে।</div><button class="create" id="createInside">＋ Add file here</button></div><button class="lock" id="again">🔒 Lock vault</button></section><div class="footer">Private access · Designed with care</div></main>
<script>let code='',currentFolder='';const pass='193720',n=document.getElementById('number'),hint=document.getElementById('hint'),lock=document.getElementById('lock'),vault=document.getElementById('vault'),file=document.getElementById('file'),fileList=document.getElementById('fileList'),home=document.getElementById('home'),folderView=document.getElementById('folderView'),folderTitle=document.getElementById('folderTitle'),folderFiles=document.getElementById('folderFiles');const files={NID:[],Documents:[]};function draw(){n.textContent=code?'•'.repeat(code.length):'Enter passcode';n.classList.toggle('placeholder',!code);hint.textContent=code?'Press unlock':'Use the keypad to unlock';hint.classList.remove('error')}function renderFolder(){folderTitle.textContent=currentFolder;folderFiles.innerHTML=files[currentFolder].length?files[currentFolder].map(x=>'<div class="file-item">📄 '+x+'</div>').join(''):'<div class="empty">এই folder এখনো খালি।<br>＋ Add file here চাপলে ফাইল যোগ হবে।</div>'}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(code.length<12){code+=b.dataset.k;draw()}});document.getElementById('back').onclick=()=>{code=code.slice(0,-1);draw()};document.getElementById('clear').onclick=()=>{code='';draw()};document.getElementById('go').onclick=()=>{if(code===pass){lock.classList.add('hidden');vault.classList.add('show');document.getElementById('status').textContent='● Unlocked'}else{hint.textContent='Incorrect passcode';hint.classList.add('error');lock.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:300});setTimeout(draw,700)}};document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{currentFolder=b.dataset.folder;home.style.display='none';folderView.classList.add('show');renderFolder()});document.getElementById('backFolder').onclick=()=>{folderView.classList.remove('show');home.style.display='block'};function chooseFile(){file.click()}document.getElementById('create').onclick=chooseFile;document.getElementById('createInside').onclick=chooseFile;file.onchange=()=>{[...file.files].forEach(f=>{if(currentFolder)files[currentFolder].push(f.name);const item=document.createElement('div');item.className='file-item';item.textContent='📄 '+f.name;fileList.appendChild(item)});if(currentFolder)renderFolder();file.value=''};document.getElementById('again').onclick=()=>{vault.classList.remove('show');vault.classList.add('hidden');folderView.classList.remove('show');home.style.display='block';lock.classList.remove('hidden');code='';currentFolder='';document.getElementById('status').textContent='● Locked';draw()};draw();</script></body></html>
