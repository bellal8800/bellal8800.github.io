<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>My Profile</title>

<style>
:root{--bg:#f2f2f7;--card:#fff;--secondary:#8e8e93;--text:#111;--line:#e5e5ea;--blue:#007aff;--red:#ff3b30;--gray:#e5e5ea;--shadow:0 8px 25px rgba(0,0,0,.06)}
body.dark{--bg:#000;--card:#1c1c1e;--secondary:#98989d;--text:#fff;--line:#38383a;--gray:#2c2c2e;--shadow:0 8px 25px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;transition:background .3s ease,color .3s ease}button,input{font:inherit}button{border:0;outline:0}.hidden{display:none!important}
@keyframes springIn{0%{opacity:0;transform:scale(.88) translateY(18px)}65%{opacity:1;transform:scale(1.025) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}@keyframes slideBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}@keyframes sheetUp{0%{opacity:0;transform:translateY(100%)}70%{opacity:1;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#lockScreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s ease,transform .65s cubic-bezier(.16,1,.3,1)}#lockScreen.unlocking{opacity:0;transform:scale(1.08);pointer-events:none}.lock-avatar{width:78px;height:78px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:38px;animation:springIn .7s both}.lock-title{margin-top:18px;font-size:30px;font-weight:750;letter-spacing:-1px;animation:springIn .7s .05s both}.lock-subtitle{margin-top:5px;color:var(--secondary);font-size:15px;animation:springIn .7s .1s both}.pin-dots{display:flex;gap:11px;margin-top:27px;margin-bottom:25px}.pin-dots.shake{animation:shake .38s ease}.pin-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--secondary);transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s ease,border-color .2s ease}.pin-dot.active{background:var(--blue);border-color:var(--blue);transform:scale(1.18)}.keypad{width:280px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.key{width:78px;height:78px;margin:auto;border-radius:50%;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);font-size:27px;transition:transform .13s cubic-bezier(.16,1,.3,1),background .2s ease}.key:active{transform:scale(.84);background:var(--gray)}.key.small{font-size:19px}.lock-error{height:20px;margin-top:13px;color:var(--red);font-size:14px}
#app{min-height:100vh;padding-bottom:110px;animation:slideIn .55s cubic-bezier(.16,1,.3,1)}.navbar{position:sticky;top:0;z-index:100;padding:max(14px,env(safe-area-inset-top)) 18px 13px;background:var(--bg);border-bottom:1px solid var(--line)}.nav-row{display:flex;align-items:center;justify-content:space-between}.app-title{font-size:31px;font-weight:760;letter-spacing:-1.2px}.nav-actions{display:flex;gap:8px}.circle-button{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.04);font-size:19px;transition:transform .15s ease}.circle-button:active{transform:scale(.86)}.search-wrapper{position:relative;margin-top:13px}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--secondary);font-size:20px}.search{width:100%;height:45px;border:0;outline:0;border-radius:13px;padding:0 15px 0 40px;background:var(--gray);color:var(--text);font-size:16px;transition:box-shadow .2s ease,transform .2s ease}.search:focus{box-shadow:0 0 0 2px rgba(0,122,255,.22)}
.content{max-width:700px;margin:auto;padding:18px 16px}.location-row{display:flex;align-items:center;min-height:30px;margin-bottom:14px}.back-button{background:none;color:var(--blue);font-size:16px;font-weight:600;padding:5px 0;animation:slideBack .35s ease}.location{margin-left:auto;color:var(--secondary);font-size:14px}.section{margin-top:20px}.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-title{font-size:21px;font-weight:700;letter-spacing:-.4px}.section-count{color:var(--secondary);font-size:13px}.folder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.folder-card{position:relative;min-height:135px;padding:17px;border-radius:21px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;animation:springIn .5s cubic-bezier(.16,1,.3,1) both}.folder-card:active{transform:scale(.95)}.folder-icon{font-size:42px;line-height:1;margin-bottom:17px}.folder-name{padding-right:25px;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-meta{margin-top:4px;color:var(--secondary);font-size:13px}.more-button{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:transparent;color:var(--secondary);font-size:21px}.more-button:active{background:var(--gray)}
.file-list{display:flex;flex-direction:column;gap:9px}.file-row{display:flex;align-items:center;gap:11px;padding:11px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 5px 18px rgba(0,0,0,.04);animation:springIn .45s cubic-bezier(.16,1,.3,1) both}.file-row:active{transform:scale(.98)}.file-icon{width:48px;height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:var(--gray);font-size:23px}.file-info{flex:1;min-width:0}.file-name{font-size:15px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{margin-top:4px;color:var(--secondary);font-size:12px}.file-button{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--gray);color:var(--text);transition:transform .14s ease}.file-button:active{transform:scale(.82)}.empty{padding:42px 20px;text-align:center;color:var(--secondary)}.empty-icon{font-size:43px;margin-bottom:9px}.fab{position:fixed;right:22px;bottom:max(23px,env(safe-area-inset-bottom));width:62px;height:62px;z-index:300;border-radius:50%;background:var(--blue);color:#fff;font-size:32px;box-shadow:0 10px 28px rgba(0,122,255,.30);animation:pop .55s .2s both;transition:transform .15s cubic-bezier(.16,1,.3,1)}.fab:active{transform:scale(.82)}
.overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);animation:fadeIn .2s ease}.sheet{width:100%;max-width:560px;padding:10px 18px max(22px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--card);box-shadow:0 -10px 35px rgba(0,0,0,.16);animation:sheetUp .45s cubic-bezier(.16,1,.3,1)}.handle{width:37px;height:5px;margin:3px auto 19px;border-radius:5px;background:var(--gray)}.sheet-title{font-size:23px;font-weight:720;margin-bottom:15px}.sheet-input{width:100%;height:51px;border:0;outline:0;border-radius:14px;padding:0 15px;background:var(--gray);color:var(--text);font-size:16px}.sheet-button{width:100%;height:51px;border-radius:14px;margin-top:9px;background:var(--blue);color:#fff;font-weight:650}.sheet-button.cancel{background:var(--gray);color:var(--text)}.action-menu{position:fixed;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));max-width:500px;margin:auto;z-index:1500;animation:sheetUp .4s cubic-bezier(.16,1,.3,1)}.action-box{overflow:hidden;border-radius:20px;background:var(--card);box-shadow:0 18px 45px rgba(0,0,0,.22)}.action-item{width:100%;min-height:53px;display:flex;align-items:center;gap:13px;padding:0 18px;text-align:left;background:var(--card);color:var(--text);border-bottom:1px solid var(--line);font-size:16px}.action-item:active{background:var(--gray)}.action-item.danger{color:var(--red)}.cancel-action{width:100%;height:53px;margin-top:9px;border-radius:18px;background:var(--card);color:var(--blue);font-weight:650;box-shadow:0 8px 25px rgba(0,0,0,.15)}.toast{position:fixed;left:50%;bottom:100px;z-index:3000;padding:11px 17px;border-radius:20px;background:#222;color:#fff;font-size:14px;opacity:0;transform:translate(-50%,20px) scale(.9);pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media(max-width:370px){.key{width:70px;height:70px}.keypad{width:250px;gap:11px}.app-title{font-size:28px}}@media(min-width:600px){.folder-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<section id="lockScreen">
<div class="lock-avatar">👤</div><div class="lock-title">My Profile</div><div class="lock-subtitle">Enter Passcode</div>
<div id="pinDots" class="pin-dots"><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span></div>
<div class="keypad">
<button class="key" onclick="pressKey('1')">1</button><button class="key" onclick="pressKey('2')">2</button><button class="key" onclick="pressKey('3')">3</button><button class="key" onclick="pressKey('4')">4</button><button class="key" onclick="pressKey('5')">5</button><button class="key" onclick="pressKey('6')">6</button><button class="key" onclick="pressKey('7')">7</button><button class="key" onclick="pressKey('8')">8</button><button class="key" onclick="pressKey('9')">9</button><button class="key small" onclick="toggleTheme()">☀︎</button><button class="key" onclick="pressKey('0')">0</button><button class="key small" onclick="backspace()">⌫</button>
</div><div id="lockError" class="lock-error"></div>
</section>
<main id="app" class="hidden">
<header class="navbar"><div class="nav-row"><div class="app-title">My Profile</div><div class="nav-actions"><button class="circle-button" onclick="toggleTheme()">◐</button></div></div><div class="search-wrapper"><span class="search-icon">⌕</span><input id="searchInput" class="search" type="search" placeholder="Search" oninput="render()"></div></header>
<section class="content"><div class="location-row"><button id="backButton" class="back-button hidden" onclick="goBack()">‹ Back</button><div id="location" class="location">My Profile</div></div>
<div class="section"><div class="section-header"><div class="section-title">Folders</div><div id="folderCount" class="section-count"></div></div><div id="folderGrid" class="folder-grid"></div></div>
<div class="section"><div class="section-header"><div class="section-title">Files</div><div id="fileCount" class="section-count"></div></div><div id="fileList" class="file-list"></div></div></section></main>
<button id="fab" class="fab hidden" onclick="showAddMenu()">+</button>
<div id="modal" class="overlay hidden" onclick="closeModal(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div id="modalTitle" class="sheet-title">New Folder</div><input id="modalInput" class="sheet-input" type="text" placeholder="Folder name" autocomplete="off"><button id="modalConfirm" class="sheet-button" onclick="confirmModal()">Create</button><button class="sheet-button cancel" onclick="hideModal()">Cancel</button></div></div>
<div id="actionMenu" class="action-menu hidden"><div class="action-box"><button class="action-item" onclick="createFolder()">📁<span>New Folder</span></button><button class="action-item" onclick="uploadFile()">📄<span>Upload Document</span></button></div><button class="cancel-action" onclick="hideActionMenu()">Cancel</button></div>
<div id="folderMenu" class="action-menu hidden"><div class="action-box"><button class="action-item" onclick="renameFolder()">✏️<span>Rename Folder</span></button><button class="action-item danger" onclick="deleteFolder()">🗑️<span>Delete Folder</span></button></div><button class="cancel-action" onclick="hideFolderMenu()">Cancel</button></div>
<div id="toast" class="toast"></div>
<script>
const PASSCODE="193720";let pin="",currentPath=[],modalMode="",selectedFolderId=null,data={folders:[],files:[]},fileDB=null;
function initDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open("MyProfileFiles",1);request.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files",{keyPath:"id"})};request.onsuccess=e=>{fileDB=e.target.result;resolve()};request.onerror=()=>reject(request.error)})}
async function startApp(){loadTheme();loadData();createDefaultFolders();try{await initDB()}catch(e){console.log(e)}}startApp();
function loadData(){const saved=localStorage.getItem("myProfileData");if(saved){try{data=JSON.parse(saved)}catch(e){data={folders:[],files:[]}}}if(!data.folders)data.folders=[];if(!data.files)data.files=[]}
function saveData(){localStorage.setItem("myProfileData",JSON.stringify(data))}function createDefaultFolders(){if(data.folders.length)return;data.folders=[{id:makeId(),name:"My Folder",parent:null},{id:makeId(),name:"My Info",parent:null},{id:makeId(),name:"My Personal Data",parent:null}];saveData()}
function makeId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function pressKey(v){if(pin.length>=6)return;pin+=v;updateDots();if(navigator.vibrate)navigator.vibrate(8);if(pin.length===6)setTimeout(checkPin,120)}function backspace(){if(!pin.length)return;pin=pin.slice(0,-1);updateDots()}
function updateDots(){document.querySelectorAll(".pin-dot").forEach((d,i)=>d.classList.toggle("active",i<pin.length))}
function checkPin(){const error=document.getElementById("lockError");if(pin===PASSCODE){error.textContent="";unlock()}else{error.textContent="Incorrect passcode";const dots=document.getElementById("pinDots");dots.classList.add("shake");if(navigator.vibrate)navigator.vibrate([20,40,20]);setTimeout(()=>{dots.classList.remove("shake");pin="";updateDots()},550)}}
function unlock(){const lock=document.getElementById("lockScreen");lock.classList.add("unlocking");setTimeout(()=>{lock.classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("fab").classList.remove("hidden");render()},520)}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("myProfileDark",document.body.classList.contains("dark"))}function loadTheme(){if(localStorage.getItem("myProfileDark")==="true")document.body.classList.add("dark")}
function getCurrentFolder(){if(!currentPath.length)return null;return data.folders.find(f=>f.id===currentPath[currentPath.length-1])||null}
function render(){const folderGrid=document.getElementById("folderGrid"),fileList=document.getElementById("fileList"),search=document.getElementById("searchInput").value.toLowerCase().trim(),currentFolder=getCurrentFolder(),parent=currentFolder?currentFolder.id:null;let folders=data.folders.filter(f=>f.parent===parent),files=data.files.filter(f=>f.parent===parent);if(search){folders=data.folders.filter(f=>f.name.toLowerCase().includes(search));files=data.files.filter(f=>f.name.toLowerCase().includes(search))}document.getElementById("location").textContent=currentFolder?currentFolder.name:"My Profile";document.getElementById("backButton").classList.toggle("hidden",!currentPath.length);document.getElementById("folderCount").textContent=folders.length?folders.length+" items":"";document.getElementById("fileCount").textContent=files.length?files.length+" files":"";folderGrid.innerHTML="";
folders.forEach((folder,index)=>{const card=document.createElement("div");card.className="folder-card";card.style.animationDelay=Math.min(index*.045,.25)+"s";card.innerHTML=`<button class="more-button" aria-label="Folder menu">⋯</button><div class="folder-open"><div class="folder-icon">📁</div><div class="folder-name">${escapeHTML(folder.name)}</div><div class="folder-meta">Folder</div></div>`;card.querySelector(".more-button").onclick=e=>openFolderMenu(e,folder.id);card.querySelector(".folder-open").onclick=()=>openFolder(folder.id);folderGrid.appendChild(card)});
fileList.innerHTML="";if(!files.length){fileList.innerHTML='<div class="empty"><div class="empty-icon">📄</div>No files here</div>'}else files.forEach((file,index)=>{const row=document.createElement("div");row.className="file-row";row.style.animationDelay=Math.min(index*.04,.2)+"s";row.innerHTML=`<div class="file-icon">${getFileIcon(file.name)}</div><div class="file-info"><div class="file-name">${escapeHTML(file.name)}</div><div class="file-size">${formatBytes(file.size)}</div></div><button class="file-button download-btn" aria-label="Download">↓</button><button class="file-button delete-btn" aria-label="Delete">🗑</button>`;row.querySelector(".file-icon").onclick=()=>openFile(file.id);row.querySelector(".file-info").onclick=()=>openFile(file.id);row.querySelector(".download-btn").onclick=()=>downloadFile(file.id);row.querySelector(".delete-btn").onclick=()=>deleteFile(file.id);fileList.appendChild(row)})}
function openFolder(id){currentPath.push(id);document.getElementById("searchInput").value="";render();window.scrollTo({top:0,behavior:"smooth"})}function goBack(){currentPath.pop();render();window.scrollTo({top:0,behavior:"smooth"})}
function showAddMenu(){document.getElementById("actionMenu").classList.remove("hidden")}function hideActionMenu(){document.getElementById("actionMenu").classList.add("hidden")}
function createFolder(){hideActionMenu();modalMode="create";document.getElementById("modalTitle").textContent="New Folder";document.getElementById("modalInput").value="";document.getElementById("modalInput").placeholder="Folder name";document.getElementById("modalConfirm").textContent="Create";document.getElementById("modal").classList.remove("hidden");setTimeout(()=>document.getElementById("modalInput").focus(),180)}
function openFolderMenu(event,id){event.stopPropagation();selectedFolderId=id;document.getElementById("folderMenu").classList.remove("hidden")}function hideFolderMenu(){document.getElementById("folderMenu").classList.add("hidden")}
function renameFolder(){hideFolderMenu();const folder=data.folders.find(f=>f.id===selectedFolderId);if(!folder)return;modalMode="rename";document.getElementById("modalTitle").textContent="Rename Folder";document.getElementById("modalInput").value=folder.name;document.getElementById("modalConfirm").textContent="Save";document.getElementById("modal").classList.remove("hidden");setTimeout(()=>document.getElementById("modalInput").focus(),120)}
function deleteFolder(){hideFolderMenu();if(!confirm("Delete this folder and everything inside it?"))return;removeFolderRecursive(selectedFolderId);saveData();render();showToast("Folder deleted")}
function removeFolderRecursive(id){const children=data.folders.filter(f=>f.parent===id);children.forEach(c=>removeFolderRecursive(c.id));data.folders=data.folders.filter(f=>f.id!==id);data.files=data.files.filter(f=>f.parent!==id)}
function confirmModal(){const input=document.getElementById("modalInput"),name=input.value.trim();if(!name){showToast("Please enter a name");return}if(modalMode==="create"){data.folders.push({id:makeId(),name,parent:currentPath.length?currentPath[currentPath.length-1]:null});showToast("Folder created")}else if(modalMode==="rename"){const folder=data.folders.find(f=>f.id===selectedFolderId);if(folder)folder.name=name;showToast("Folder renamed")}saveData();hideModal();render()}
function hideModal(){document.getElementById("modal").classList.add("hidden")}function closeModal(event){if(event.target===document.getElementById("modal"))hideModal()}
function uploadFile(){hideActionMenu();const input=document.createElement("input");input.type="file";input.accept=".pdf,.doc,.docx";input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const id=makeId();await saveBlob(id,file);data.files.push({id,name:file.name,size:file.size,type:file.type,parent:currentPath.length?currentPath[currentPath.length-1]:null,created:Date.now()});saveData();render();showToast("Document uploaded")}catch(e){console.error(e);showToast("Could not save file")}};input.click()}
function saveBlob(id,file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error("No file"));if(!fileDB)return reject(new Error("Database unavailable"));const tx=fileDB.transaction("files","readwrite");tx.objectStore("files").put({id,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function getBlob(id){return new Promise((resolve,reject)=>{if(!fileDB)return reject(new Error("Database unavailable"));const tx=fileDB.transaction("files","readonly"),req=tx.objectStore("files").get(id);req.onsuccess=()=>req.result?resolve(req.result.blob):reject(new Error("File not found"));req.onerror=()=>reject(req.error)})}
async function openFile(id){try{const blob=await getBlob(id),url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){showToast("File not found")}}
async function downloadFile(id){const file=data.files.find(f=>f.id===id);if(!file)return;try{const blob=await getBlob(id),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=file.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("Download started")}catch(e){showToast("File not found")}}
function deleteFile(id){const file=data.files.find(f=>f.id===id);if(!file||!confirm("Delete "+file.name+"?"))return;if(fileDB){const tx=fileDB.transaction("files","readwrite");tx.objectStore("files").delete(id)}data.files=data.files.filter(f=>f.id!==id);saveData();render();showToast("File deleted")}
function getFileIcon(name){const lower=name.toLowerCase();return lower.endsWith(".pdf")?"📕":lower.endsWith(".doc")||lower.endsWith(".docx")?"📘":"📄"}function formatBytes(bytes){if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";return(bytes/(1024*1024)).toFixed(1)+" MB"}function escapeHTML(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
let toastTimer;function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1900)}
</script>
</body>
</html>
