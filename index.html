<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<title>Bellal Vault</title>
<style>
:root{--bg:#07080d;--surface:rgba(23,25,35,.72);--surface2:rgba(255,255,255,.075);--text:#f8f8fc;--muted:#9699aa;--line:rgba(255,255,255,.11);--accent:#8b9aff;--accent2:#596df1;--green:#50e39a;--red:#ff6d83;--shadow:0 30px 100px rgba(0,0,0,.48)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(650px 430px at 50% -12%,#34395d 0%,#151725 40%,#07080d 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;display:grid;place-items:center;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{position:relative;width:min(430px,100%);min-height:700px;padding:20px 20px 22px;border:1px solid var(--line);border-radius:42px;overflow:hidden;background:linear-gradient(145deg,rgba(35,37,51,.82),rgba(12,14,21,.96));box-shadow:var(--shadow);isolation:isolate;animation:appIn .8s cubic-bezier(.16,1,.3,1)}.app:before,.app:after{content:"";position:absolute;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(2px)}.app:before{width:250px;height:250px;top:-155px;right:-80px;background:#7285ff;opacity:.22}.app:after{width:180px;height:180px;bottom:-120px;left:-80px;background:#4b5eff;opacity:.12}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750;letter-spacing:-.04em}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#aab5ff,#5369ed);box-shadow:0 10px 28px #6375ff3d;font-size:19px}.status{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #50e39a28;border-radius:999px;background:#50e39a0d;color:var(--green);font-size:11px;font-weight:650}.dot{font-size:9px}.lock-screen{transition:opacity .35s,transform .55s cubic-bezier(.16,1,.3,1)}.lock-screen.exit{opacity:0;transform:scale(.94) translateY(-12px);pointer-events:none}.screen{text-align:center;margin:66px 0 25px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:650}.number{min-height:52px;margin-top:15px;font-size:38px;line-height:1.2;font-weight:700;letter-spacing:.12em;word-break:break-all}.number.placeholder{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:500;padding-top:17px}.hint{height:20px;margin-top:8px;color:var(--muted);font-size:12px;transition:color .2s}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 3px 24px}.key{height:70px;border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.075);box-shadow:inset 0 1px rgba(255,255,255,.035),0 5px 12px #00000012;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .28s cubic-bezier(.16,1,.3,1),background .25s,border-color .25s,box-shadow .25s}.key strong{font-size:24px;line-height:1;font-weight:620}.key small{height:12px;margin-top:5px;color:#9296aa;font-size:8px;letter-spacing:.16em}.key:hover{background:rgba(255,255,255,.13);border-color:#ffffff22;box-shadow:0 8px 20px #00000020}.key:active{transform:scale(.86);background:rgba(139,154,255,.25);border-color:#9ba8ff66;transition-duration:.08s}.actions{display:flex;align-items:center;justify-content:center;gap:30px}.side-action{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.035);color:var(--muted);font-size:17px;transition:transform .25s,background .25s,color .25s}.side-action:hover{background:rgba(255,255,255,.1);color:var(--text)}.side-action:active{transform:scale(.82)}.unlock{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#aab5ff,#5b70f2 70%);color:#10152f;font-size:27px;box-shadow:0 14px 34px #596ff155,inset 0 1px #ffffff70;transition:transform .3s cubic-bezier(.16,1,.3,1),filter .25s}.unlock:before{content:"";position:absolute;inset:5px;border:1px solid #ffffff35;border-radius:50%}.unlock:hover{filter:brightness(1.08);transform:translateY(-2px)}.unlock:active{transform:scale(.86)}.footer{text-align:center;color:#666a7c;font-size:10px;margin-top:29px;letter-spacing:.02em}.vault{display:none;opacity:0;transform:translateY(22px) scale(.98)}.vault.show{display:block;animation:vaultIn .65s cubic-bezier(.16,1,.3,1) forwards}.vault-head{text-align:center;margin:50px 0 27px}.vault-icon{width:76px;height:76px;margin:0 auto 17px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#313a72,#1c244b);border:1px solid #aab5ff25;box-shadow:0 15px 35px #00000030;font-size:35px}.vault h1{margin:0;font-size:27px;letter-spacing:-.055em}.vault p{margin:9px 0 0;color:var(--muted);font-size:12px}.upload{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;border-radius:21px;background:linear-gradient(145deg,#8d9bff,#596ff1);box-shadow:0 12px 28px #596ff13b,inset 0 1px #ffffff55;font-size:14px;font-weight:700;transition:transform .3s cubic-bezier(.16,1,.3,1),filter .25s}.upload:hover{filter:brightness(1.08);transform:translateY(-2px)}.upload:active{transform:scale(.96)}#fileInput{display:none}.file-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;max-height:285px;overflow:auto;padding-right:2px}.file-list::-webkit-scrollbar{width:4px}.file-list::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:9px}.empty{padding:31px 15px;text-align:center;color:var(--muted);background:#ffffff05;border:1px dashed #ffffff18;border-radius:20px;font-size:12px;line-height:1.8}.file{display:flex;align-items:center;gap:12px;padding:12px;border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid #ffffff0d;animation:fileIn .4s cubic-bezier(.16,1,.3,1)}.file-icon{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:#8999ff18;color:#aeb8ff;font-size:18px}.file-info{min-width:0;flex:1}.file-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{margin-top:5px;color:var(--muted);font-size:10px}.file-actions{display:flex;gap:5px}.mini{width:31px;height:31px;border-radius:11px;background:#ffffff08;color:var(--muted);font-size:14px;transition:transform .2s,background .2s,color .2s}.mini:hover{background:#ffffff15;color:var(--text)}.mini:active{transform:scale(.8)}.vault-bottom{display:flex;justify-content:center;margin-top:23px}.lock{padding:10px 16px;border-radius:999px;background:#ffffff08;border:1px solid #ffffff10;color:var(--muted);font-size:11px;transition:transform .25s,background .25s}.lock:hover{background:#ffffff12;color:var(--text)}.lock:active{transform:scale(.94)}.toast{position:absolute;z-index:5;left:20px;right:20px;bottom:18px;padding:13px 15px;text-align:center;border:1px solid #ffffff15;border-radius:16px;background:rgba(42,45,60,.94);box-shadow:0 12px 35px #00000030;color:#f2f3ff;font-size:12px;opacity:0;transform:translateY(18px) scale(.96);pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.16,1,.3,1)}.toast.show{opacity:1;transform:none}.hidden{display:none!important}@keyframes appIn{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:none}}@keyframes vaultIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}@keyframes fileIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}@media(max-height:700px){.app{min-height:auto}.screen{margin:35px 0 20px}.key{height:62px}.dial{gap:9px;margin:20px 3px}.vault-head{margin:30px 0 22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" aria-label="Bellal Vault">
<header class="top"><div class="brand"><div class="logo">🔐</div><span>Bellal Vault</span></div><div class="status" id="status"><span class="dot">●</span> Locked</div></header>
<section class="lock-screen" id="lockScreen"><section class="screen"><div class="eyebrow">Private access</div><div class="number placeholder" id="number">Enter passcode</div><div class="hint" id="hint">Use the keypad to unlock</div></section>
<section class="dial" aria-label="Passcode keypad"><button class="key" data-key="1"><strong>1</strong><small>&nbsp;</small></button><button class="key" data-key="2"><strong>2</strong><small>ABC</small></button><button class="key" data-key="3"><strong>3</strong><small>DEF</small></button><button class="key" data-key="4"><strong>4</strong><small>GHI</small></button><button class="key" data-key="5"><strong>5</strong><small>JKL</small></button><button class="key" data-key="6"><strong>6</strong><small>MNO</small></button><button class="key" data-key="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-key="8"><strong>8</strong><small>TUV</small></button><button class="key" data-key="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-key="*"><strong>*</strong><small>&nbsp;</small></button><button class="key" data-key="0"><strong>0</strong><small>+</small></button><button class="key" data-key="#"><strong>#</strong><small>&nbsp;</small></button></section>
<div class="actions"><button class="side-action" id="backspace" aria-label="Delete">⌫</button><button class="unlock" id="unlock" aria-label="Unlock">🔓</button><button class="side-action" id="clear" aria-label="Clear">C</button></div></section>
<section class="vault" id="vault"><div class="vault-head"><div class="vault-icon">🗂️</div><h1>My Private Vault</h1><p>Your files are stored in this browser.</p></div><label class="upload" for="fileInput"><span>＋</span> Add files<input id="fileInput" type="file" multiple></label><div class="file-list" id="fileList"></div><div class="vault-bottom"><button class="lock" id="lockAgain">🔒 Lock vault</button></div></section>
<div class="footer">Private access · Designed with care</div><div class="toast" id="toast" role="status"></div>
</main>
<script>
const PASSCODE='193720';let value='',timer;const $=id=>document.getElementById(id);const numberEl=$('number'),hintEl=$('hint'),statusEl=$('status'),toast=$('toast'),lockScreen=$('lockScreen'),vault=$('vault'),unlockBtn=$('unlock'),fileInput=$('fileInput'),fileList=$('fileList');
function render(){if(value){numberEl.textContent='•'.repeat(value.length);numberEl.classList.remove('placeholder');hintEl.textContent='Press unlock'}else{numberEl.textContent='Enter passcode';numberEl.classList.add('placeholder');hintEl.textContent='Use the keypad to unlock'}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2300)}
function add(k){if(value.length<12){value+=k;render()}}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.key)));
$('backspace').onclick=()=>{value=value.slice(0,-1);render()};$('clear').onclick=()=>{value='';render()};
function getFiles(){try{return JSON.parse(localStorage.getItem('bellalVaultFiles')||'[]')}catch(e){return[]}}
function saveFiles(files){localStorage.setItem('bellalVaultFiles',JSON.stringify(files))}
function sizeText(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';return(bytes/1048576).toFixed(1)+' MB'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderFiles(){const files=getFiles();if(!files.length){fileList.innerHTML='<div class="empty">No files yet.<br>Add your first file to the vault.</div>';return}fileList.innerHTML=files.map((f,i)=>`<div class="file"><div class="file-icon">📄</div><div class="file-info"><div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div><div class="file-size">${sizeText(f.size)}</div></div><div class="file-actions"><button class="mini" data-download="${i}" aria-label="Download">↓</button><button class="mini" data-delete="${i}" aria-label="Delete">×</button></div></div>`).join('');fileList.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(+b.dataset.download));fileList.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteFile(+b.dataset.delete))}
function downloadFile(i){const f=getFiles()[i];if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
function deleteFile(i){const files=getFiles();files.splice(i,1);saveFiles(files);renderFiles();notify('File removed')}
fileInput.onchange=()=>{const selected=[...fileInput.files];if(!selected.length)return;let files=getFiles(),pending=selected.length;selected.forEach(file=>{const reader=new FileReader();reader.onload=()=>{files.push({name:file.name,size:file.size,type:file.type,data:reader.result});pending--;if(!pending){saveFiles(files);renderFiles();notify(selected.length+' file'+(selected.length>1?'s':'')+' added')}};reader.readAsDataURL(file)});fileInput.value=''};
unlockBtn.onclick=()=>{if(value===PASSCODE){lockScreen.classList.add('exit');statusEl.innerHTML='<span class="dot">●</span> Unlocked';setTimeout(()=>{lockScreen.classList.add('hidden');vault.classList.add('show');renderFiles();notify('Vault unlocked')},430)}else{notify('Wrong passcode');numberEl.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'none'}],{duration:320});value='';render()}};
$('lockAgain').onclick=()=>{vault.classList.remove('show');setTimeout(()=>{vault.style.display='none';lockScreen.classList.remove('hidden','exit');lockScreen.style.display='block';value='';statusEl.innerHTML='<span class="dot">●</span> Locked';render();vault.style.display=''},430)};
window.addEventListener('keydown',e=>{if(/^[0-9*#]$/.test(e.key))add(e.key);else if(e.key==='Backspace'){value=value.slice(0,-1);render()}else if(e.key==='Escape'){value='';render()}else if(e.key==='Enter')unlockBtn.click()});render();
</script>
</body>
</html>
