<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<title>My Profile</title>
<style>
:root{--bg:#090a10;--panel:rgba(24,27,42,.78);--panel2:rgba(255,255,255,.075);--text:#f8f9ff;--muted:#9da3b8;--accent:#aebaff;--accent2:#6679ff;--line:rgba(255,255,255,.13);--spring:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(80% 55% at 50% 0,#343d78 0%,#171a2a 43%,#090a10 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{position:relative;width:min(430px,100%);min-height:700px;padding:22px;border:1px solid rgba(255,255,255,.15);border-radius:42px;background:linear-gradient(145deg,rgba(42,47,72,.92),rgba(12,14,23,.96));box-shadow:0 35px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08);overflow:hidden}
.app:before{content:"";position:absolute;inset:-40% -20% auto;height:330px;background:radial-gradient(circle,rgba(164,177,255,.16),transparent 68%);pointer-events:none}.top,.screen,.dial,.actions,.vault,.footer{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:760;letter-spacing:-.03em}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d6dcff,#6378f4);font-size:20px;box-shadow:0 8px 22px #596ff155}.status{padding:8px 12px;border-radius:999px;background:#62e6a214;border:1px solid #62e6a238;color:#72e8ad;font-size:11px;font-weight:650}
.screen{text-align:center;margin:64px 0 25px}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}.number{margin-top:15px;min-height:48px;font-size:38px;font-weight:720;letter-spacing:.18em;text-shadow:0 5px 25px #0004}.placeholder{font-size:15px;letter-spacing:0;color:var(--muted);padding-top:14px}.hint{font-size:12px;color:var(--muted);margin-top:8px;height:18px;transition:color .25s}.hint.error{color:#ff9fae}
.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;justify-items:center}.key,.round,.unlock,.folder,.create,.lock{font:inherit;cursor:pointer;user-select:none}.key{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:inset 0 1px rgba(255,255,255,.16),0 9px 24px rgba(0,0,0,.2);transition:transform .5s var(--spring),background .3s var(--spring),box-shadow .3s var(--spring)}.key strong{font-size:25px;font-weight:600}.key small{height:12px;margin-top:4px;font-size:8px;letter-spacing:.16em;color:#a1a7bd}.key:hover{transform:translateY(-2px);background:rgba(255,255,255,.2);box-shadow:0 14px 30px #0004,0 0 0 4px #aebaff12}.key:active{transform:scale(.82);background:#aebaff55;box-shadow:0 0 0 9px #aebaff16;transition-duration:.08s}.actions{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:26px}.round,.unlock{display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.07);transition:transform .45s var(--spring),background .25s}.round{width:50px;height:50px}.round:hover{background:rgba(255,255,255,.13)}.round:active,.unlock:active,.folder:active,.create:active,.lock:active{transform:scale(.86);transition-duration:.08s}.unlock{width:78px;height:78px;font-size:27px;color:#10152f;background:linear-gradient(145deg,#d0d7ff,#657af3);box-shadow:0 16px 36px #596ff155, inset 0 1px #fff8}.unlock:hover{transform:translateY(-3px);box-shadow:0 20px 42px #596ff177,inset 0 1px #fff8}
.vault{display:none;text-align:center}.vault.show{display:block;animation:appear .7s var(--spring)}.vault-icon{width:82px;height:82px;margin:50px auto 18px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#3b478c,#242c62);font-size:36px;box-shadow:0 18px 40px #0003}.vault h1{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.vault p{font-size:12px;color:var(--muted)}.folders{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:25px 0 14px}.folder{padding:20px 12px;text-align:left;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));color:var(--text);box-shadow:0 10px 25px #0002;transition:transform .5s var(--spring),background .3s}.folder:hover{transform:translateY(-4px);background:rgba(255,255,255,.14)}.folder b{display:block;font-size:29px}.folder strong{display:block;margin-top:12px;font-size:15px}.folder span{font-size:11px;color:var(--muted)}.create{width:100%;padding:17px;border:1px solid #ffffff18;border-radius:22px;background:linear-gradient(145deg,#b9c4ff,#687bf2);color:#11152e;font-weight:750;box-shadow:0 14px 30px #596ff133;transition:transform .45s var(--spring),box-shadow .3s}.create:hover{transform:translateY(-3px);box-shadow:0 19px 36px #596ff155}.lock{margin-top:22px;padding:11px 17px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--muted);transition:transform .4s var(--spring)}.footer{text-align:center;color:#6f7488;font-size:10px;margin-top:30px}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(28px) scale(.96);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .32s ease}.file-list{margin-top:16px;text-align:left;display:grid;gap:8px}.file-item{padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:370px){.app{padding:19px;border-radius:34px}.key{width:68px;height:68px}.dial{gap:11px}.screen{margin-top:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="avatar">👤</div><span>My Profile</span></div><div class="status" id="status">● Locked</div></header>
<section id="lock"><div class="screen"><div class="eyebrow">Private access</div><div id="number" class="number placeholder">Enter passcode</div><div id="hint" class="hint">Use the keypad to unlock</div></div>
<div class="dial"><button class="key" data-k="1"><strong>1</strong><small></small></button><button class="key" data-k="2"><strong>2</strong><small>ABC</small></button><button class="key" data-k="3"><strong>3</strong><small>DEF</small></button><button class="key" data-k="4"><strong>4</strong><small>GHI</small></button><button class="key" data-k="5"><strong>5</strong><small>JKL</small></button><button class="key" data-k="6"><strong>6</strong><small>MNO</small></button><button class="key" data-k="7"><strong>7</strong><small>PQRS</small></button><button class="key" data-k="8"><strong>8</strong><small>TUV</small></button><button class="key" data-k="9"><strong>9</strong><small>WXYZ</small></button><button class="key" data-k="*"><strong>*</strong><small></small></button><button class="key" data-k="0"><strong>0</strong><small>+</small></button><button class="key" data-k="#"><strong>#</strong><small></small></button></div>
<div class="actions"><button class="round" id="back" aria-label="Backspace">⌫</button><button class="unlock" id="go" aria-label="Unlock">🔓</button><button class="round" id="clear">C</button></div></section>
<section id="vault" class="vault"><div class="vault-icon">🗂️</div><h1>My Private Files</h1><p>Organize your important files in folders.</p><div class="folders"><button class="folder" data-folder="NID"><b>🪪</b><strong>NID</strong><span>Identity documents</span></button><button class="folder" data-folder="Document"><b>📁</b><strong>Document</strong><span>Personal documents</span></button></div><button class="create" id="create">＋ Create new file</button><input id="file" type="file" multiple hidden><div id="fileList" class="file-list"></div><button class="lock" id="again">🔒 Lock vault</button></section>
<div class="footer">Private access · Designed with care</div></main>
<script>
let code='';const pass='193720';const n=document.getElementById('number'),hint=document.getElementById('hint'),lock=document.getElementById('lock'),vault=document.getElementById('vault'),file=document.getElementById('file'),fileList=document.getElementById('fileList');
function draw(){n.textContent=code?'•'.repeat(code.length):'Enter passcode';n.classList.toggle('placeholder',!code);hint.textContent=code?'Press unlock':'Use the keypad to unlock';hint.classList.remove('error')}
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{if(code.length<12){code+=b.dataset.k;draw()}}));
document.getElementById('back').onclick=()=>{code=code.slice(0,-1);draw()};document.getElementById('clear').onclick=()=>{code='';draw()};
document.getElementById('go').onclick=()=>{if(code===pass){lock.classList.add('hidden');vault.classList.add('show');document.getElementById('status').textContent='● Unlocked'}else{hint.textContent='Incorrect passcode';hint.classList.add('error');lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake');setTimeout(draw,700)}};
document.getElementById('create').onclick=()=>file.click();file.onchange=()=>{[...file.files].forEach(f=>{const item=document.createElement('div');item.className='file-item';item.textContent='📄 '+f.name;fileList.appendChild(item)});file.value=''};
document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{hint.textContent=b.dataset.folder+' folder selected';});
document.getElementById('again').onclick=()=>{vault.classList.remove('show');vault.classList.add('hidden');lock.classList.remove('hidden');code='';document.getElementById('status').textContent='● Locked';fileList.innerHTML='';draw()};draw();
</script>
</body>
</html>
