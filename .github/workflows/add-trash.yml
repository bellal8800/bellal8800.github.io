name: Add Trash System

on:
  push:
    paths:
      - '.github/workflows/add-trash.yml'
      - 'scripts/add-trash.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-trash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trash system
        run: python3 scripts/add-trash.py
      - name: Commit Trash changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Trash system"
          git push
