name: Add Trash System

on:
  push:
    paths:
      - '.github/workflows/add-trash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-trash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Trash system
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="trash-style"' in s and 'function openTrash()' in s:
              print('Trash system already installed')
              raise SystemExit(0)
          nav_old = '<div class="nav-actions"><button class="circle-button" onclick="toggleTheme()">◐</button></div>'
          nav_new = '<div class="nav-actions"><button class="circle-button" onclick="openTrash()" aria-label="Trash">🗑</button><button class="circle-button" onclick="toggleTheme()">◐</button></div>'
          if nav_old not in s: raise SystemExit('Navigation anchor not found')
          s = s.replace(nav_old, nav_new, 1)
          state_old = 'let pin="",currentPath=[],modalMode="",selectedFolderId=null,data={folders:[],files:[]},fileDB=null;'
          state_new = 'let pin="",currentPath=[],modalMode="",selectedFolderId=null,data={folders:[],files:[]},fileDB=null,trashView=false;'
          if state_old not in s: raise SystemExit('State anchor not found')
          s = s.replace(state_old, state_new, 1)
          s = s.replace('data.folders.filter(f=>f.parent===parent)', 'data.folders.filter(f=>f.parent===parent&&!f.trashed)', 1)
          s = s.replace('data.files.filter(f=>f.parent===parent)', 'data.files.filter(f=>f.parent===parent&&!f.trashed)', 1)
          s = s.replace('folders=data.folders.filter(f=>f.name.toLowerCase().includes(search))', 'folders=data.folders.filter(f=>!f.trashed&&f.name.toLowerCase().includes(search))', 1)
          s = s.replace('files=data.files.filter(f=>f.name.toLowerCase().includes(search))', 'files=data.files.filter(f=>!f.trashed&&f.name.toLowerCase().includes(search))', 1)
          style = r'''<style id="trash-style">
.trash-empty-btn{border:0;background:var(--gray);color:var(--red);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:650}
.trash-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 5px 18px rgba(0,0,0,.04);animation:springIn .45s var(--ios18-spring) both}
.trash-info{flex:1;min-width:0}.trash-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trash-meta{margin-top:4px;color:var(--secondary);font-size:12px}.trash-actions{display:flex;gap:7px}.trash-action{width:38px;height:38px;border-radius:50%;background:var(--gray);color:var(--text);font-size:17px}.trash-action.danger{color:var(--red)}
</style>
'''
          s = s.replace('</head>', style + '</head>', 1)
          code = r'''
/* ===== Trash System ===== */
function openTrash(){trashView=true;currentPath=[];document.getElementById("searchInput").value="";renderTrash();window.scrollTo({top:0,behavior:"smooth"})}
function closeTrash(){trashView=false;currentPath=[];render();window.scrollTo({top:0,behavior:"smooth"})}
function trashFolders(){return data.folders.filter(f=>f.trashed)}
function trashFiles(){return data.files.filter(f=>f.trashed)}
function markFolderTrash(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;folder.trashed=true;folder.trashedAt=Date.now();data.folders.filter(f=>f.parent===id).forEach(c=>markFolderTrash(c.id));data.files.filter(f=>f.parent===id).forEach(f=>{f.trashed=true;f.trashedAt=Date.now()})}
function moveFolderToTrash(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;if(!confirm('Move "'+folder.name+'" to Trash?'))return;markFolderTrash(id);saveData();render();showToast('Moved to Trash')}
function markFileTrash(id){const f=data.files.find(x=>x.id===id);if(f){f.trashed=true;f.trashedAt=Date.now()}}
function moveFileToTrash(id){const file=data.files.find(f=>f.id===id);if(!file)return;if(!confirm('Move "'+file.name+'" to Trash?'))return;markFileTrash(id);saveData();render();showToast('Moved to Trash')}
async function deleteBlob(id){if(!fileDB)return;await new Promise(resolve=>{try{const tx=fileDB.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve}catch(e){resolve()}})}
function restoreFolder(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;folder.trashed=false;delete folder.trashedAt;data.folders.filter(f=>f.parent===id).forEach(c=>{if(c.trashed)restoreFolder(c.id)});data.files.filter(f=>f.parent===id).forEach(f=>{f.trashed=false;delete f.trashedAt});saveData();renderTrash();showToast('Folder restored')}
function restoreFile(id){const f=data.files.find(x=>x.id===id);if(!f)return;f.trashed=false;delete f.trashedAt;saveData();renderTrash();showToast('File restored')}
async function permanentDeleteFile(id){const file=data.files.find(f=>f.id===id);if(!file)return;if(!confirm('Delete "'+file.name+'" permanently?'))return;await deleteBlob(id);data.files=data.files.filter(f=>f.id!==id);saveData();renderTrash();showToast('Deleted permanently')}
async function permanentDeleteFolder(id){const folder=data.folders.find(f=>f.id===id);if(!folder)return;if(!confirm('Delete this folder and everything inside it permanently?'))return;const folderIds=[];const collect=(fid)=>{folderIds.push(fid);data.folders.filter(f=>f.parent===fid).forEach(c=>collect(c.id))};collect(id);const fileIds=data.files.filter(f=>folderIds.includes(f.parent)).map(f=>f.id);for(const fid of fileIds)await deleteBlob(fid);data.files=data.files.filter(f=>!folderIds.includes(f.parent));data.folders=data.folders.filter(f=>!folderIds.includes(f.id));saveData();renderTrash();showToast('Folder deleted permanently')}
async function emptyTrash(){const tf=trashFiles(),td=trashFolders();if(!tf.length&&!td.length){showToast('Trash is empty');return}if(!confirm('Empty Trash permanently? This cannot be undone.'))return;for(const f of tf)await deleteBlob(f.id);data.files=data.files.filter(f=>!f.trashed);data.folders=data.folders.filter(f=>!f.trashed);saveData();renderTrash();showToast('Trash emptied')}
function renderTrash(){const folderGrid=document.getElementById('folderGrid'),fileList=document.getElementById('fileList');const folders=trashFolders().filter(f=>!f.parent||data.folders.find(p=>p.id===f.parent&&!p.trashed));const files=trashFiles().filter(f=>!data.folders.find(p=>p.id===f.parent&&p.trashed));document.getElementById('location').textContent='Trash';document.getElementById('backButton').classList.remove('hidden');document.getElementById('backButton').textContent='‹ Back';document.getElementById('backButton').onclick=closeTrash;document.getElementById('folderCount').innerHTML='<button class="trash-empty-btn" onclick="emptyTrash()">Empty Trash</button>';document.getElementById('fileCount').textContent=(folders.length+files.length)?(folders.length+files.length)+' items':'';folderGrid.innerHTML='';fileList.innerHTML='';if(!folders.length)folderGrid.innerHTML='<div class="empty"><div class="empty-icon">🗑️</div>No folders in Trash</div>';folders.forEach((folder,index)=>{const card=document.createElement('div');card.className='trash-row';card.style.animationDelay=Math.min(index*.04,.2)+'s';card.innerHTML='<div class="file-icon">📁</div><div class="trash-info"><div class="trash-name">'+escapeHTML(folder.name)+'</div><div class="trash-meta">Folder • Trash</div></div><div class="trash-actions"><button class="trash-action" onclick="restoreFolder(\''+folder.id+'\')" aria-label="Restore">↩</button><button class="trash-action danger" onclick="permanentDeleteFolder(\''+folder.id+'\')" aria-label="Delete permanently">🗑</button></div>';folderGrid.appendChild(card)});if(!files.length)fileList.innerHTML='<div class="empty"><div class="empty-icon">📄</div>No files in Trash</div>';files.forEach((file,index)=>{const row=document.createElement('div');row.className='trash-row';row.style.animationDelay=Math.min(index*.04,.2)+'s';row.innerHTML='<div class="file-icon">'+getFileIcon(file.name)+'</div><div class="trash-info"><div class="trash-name">'+escapeHTML(file.name)+'</div><div class="trash-meta">'+formatBytes(file.size)+' • Trash</div></div><div class="trash-actions"><button class="trash-action" onclick="restoreFile(\''+file.id+'\')" aria-label="Restore">↩</button><button class="trash-action danger" onclick="permanentDeleteFile(\''+file.id+'\')" aria-label="Delete permanently">🗑</button></div>';fileList.appendChild(row)})}
'''
          s = s.replace('</script>', code + '</script>', 1)
          old_df = 'function deleteFolder(){hideFolderMenu();if(!confirm("Delete this folder and everything inside it?"))return;removeFolderRecursive(selectedFolderId);saveData();render();showToast("Folder deleted")}'
          new_df = 'function deleteFolder(){hideFolderMenu();moveFolderToTrash(selectedFolderId)}'
          if old_df not in s: raise SystemExit('deleteFolder anchor not found')
          s = s.replace(old_df,new_df,1)
          old_dfile = 'function deleteFile(id){const file=data.files.find(f=>f.id===id);if(!file||!confirm("Delete "+file.name+"?"))return;if(fileDB){const tx=fileDB.transaction("files","readwrite");tx.objectStore("files").delete(id)}data.files=data.files.filter(f=>f.id!==id);saveData();render();showToast("File deleted")}'
          new_dfile = 'function deleteFile(id){moveFileToTrash(id)}'
          if old_dfile not in s: raise SystemExit('deleteFile anchor not found')
          s = s.replace(old_dfile,new_dfile,1)
          p.write_text(s,encoding='utf-8')
          print('Trash system installed')
