name: Fix image open v2
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image click and preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</body>'
          patch=r'''<style id="image-open-v2">
          .image-preview{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:20px;animation:fadeIn .2s ease}
          .image-preview img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:14px}
          .image-preview-close{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:28px}
          </style>
          <script>
          async function openImagePreview(id){
            try{
              const file=data.files.find(f=>f.id===id);
              if(!file||file.trashed)return;
              const blob=await loadBlob(id);
              if(!blob){showToast('Image not found');return;}
              const url=URL.createObjectURL(blob);
              const old=document.getElementById('imagePreview');
              if(old)old.remove();
              const box=document.createElement('div');
              box.id='imagePreview'; box.className='image-preview';
              box.innerHTML='<button class="image-preview-close" aria-label="Close">×</button><img alt="Preview">';
              box.querySelector('img').src=url;
              box.querySelector('.image-preview-close').onclick=()=>{URL.revokeObjectURL(url);box.remove()};
              box.onclick=e=>{if(e.target===box){URL.revokeObjectURL(url);box.remove()}};
              document.body.appendChild(box);
            }catch(e){console.error(e);showToast('Could not open image')}
          }
          </script>'''
          s=s.replace(marker,patch+'\n'+marker)
          # Make every file row open images when tapped, while preserving download/delete buttons.
          needle='row.querySelector(".delete-btn").onclick=()=>deleteFile(file.id);'
          repl='''row.querySelector(".delete-btn").onclick=()=>deleteFile(file.id);
          if(/\\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
            row.style.cursor="pointer";
            row.addEventListener("click",e=>{if(e.target.closest("button"))return;openImagePreview(file.id)});
          }'''
          if needle in s and 'openImagePreview(file.id)' not in s:
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix image tap to open preview"
          git push
