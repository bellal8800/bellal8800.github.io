name: Fix file open direct

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair file opening
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          preview_style = '''<style id="image-preview-direct-style">
          .image-preview-direct{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:18px;animation:fadeIn .2s ease}
          .image-preview-direct img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:14px}
          .image-preview-direct-close{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;z-index:2}
          </style>'''

          preview_js = '''<script id="image-preview-direct-js">
          async function openImagePreviewDirect(id){
            try{
              const file=data.files.find(f=>f.id===id);
              if(!file||file.trashed)return;
              const blob=await getBlob(id);
              if(!blob){showToast("Image not found");return;}
              const old=document.getElementById("imagePreviewDirect");
              if(old){if(old.dataset.url)URL.revokeObjectURL(old.dataset.url);old.remove()}
              const url=URL.createObjectURL(blob);
              const box=document.createElement("div");
              box.id="imagePreviewDirect";
              box.className="image-preview-direct";
              box.dataset.url=url;
              const close=document.createElement("button");
              close.className="image-preview-direct-close";
              close.type="button";
              close.setAttribute("aria-label","Close");
              close.textContent="×";
              const img=document.createElement("img");
              img.src=url;
              img.alt=file.name;
              const closePreview=()=>{URL.revokeObjectURL(url);box.remove()};
              close.onclick=closePreview;
              box.onclick=e=>{if(e.target===box)closePreview()};
              box.appendChild(close);
              box.appendChild(img);
              document.body.appendChild(box);
            }catch(e){console.error(e);showToast("Could not open image")}
          }
          </script>'''

          if 'id="image-preview-direct-js"' not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, preview_style + '\n' + preview_js + '\n' + marker, 1)
                  changed = True

          def replace_function(text, names, replacement):
              for name in names:
                  m = re.search(r'(?:async\\s+)?function\\s+' + re.escape(name) + r'\\s*\\(\\s*id\\s*\\)\\s*\\{', text)
                  if not m:
                      continue
                  start = m.start()
                  brace = text.find('{', m.start())
                  depth = 0
                  quote = None
                  esc = False
                  i = brace
                  while i < len(text):
                      c = text[i]
                      if quote:
                          if esc: esc = False
                          elif c == '\\\\': esc = True
                          elif c == quote: quote = None
                      else:
                          if c in ('"', "'", '`'): quote = c
                          elif c == '{': depth += 1
                          elif c == '}':
                              depth -= 1
                              if depth == 0:
                                  return text[:start] + replacement + text[i+1:], True
                      i += 1
              return text, False

          replacement = '''function openFile(id){
            const file=data.files.find(f=>f.id===id);
            if(!file||file.trashed)return;
            if(/\\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
              openImagePreviewDirect(id);
              return;
            }
            const win=window.open("about:blank","_blank");
            if(!win){showToast("Allow pop-ups to open files");return}
            getBlob(id).then(blob=>{
              const url=URL.createObjectURL(blob);
              win.location.href=url;
              setTimeout(()=>URL.revokeObjectURL(url),60000);
            }).catch(e=>{
              console.error(e);
              try{win.close()}catch(_){ }
              showToast("File not found");
            });
          }'''

          s2, did = replace_function(s, ['openFile'], replacement)
          if did:
              s = s2
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('No repair needed')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix image and document opening"
          git push