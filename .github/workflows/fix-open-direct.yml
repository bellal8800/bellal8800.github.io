name: One-time image open repair

on:
  push:
    paths:
      - '.github/workflows/fix-open-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch image opening safely
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''async function openFile(id){try{const blob=await getBlob(id),url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){showToast("File not found")}}'''
          new = '''async function openFile(id){
            const file=data.files.find(f=>f.id===id);
            if(!file||file.trashed)return;
            if(/\\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
              openImagePreviewDirect(id);
              return;
            }
            try{
              const blob=await getBlob(id),url=URL.createObjectURL(blob);
              window.open(url,"_blank");
              setTimeout(()=>URL.revokeObjectURL(url),60000);
            }catch(e){showToast("File not found")}
          }'''
          changed=False
          if old in s:
              s=s.replace(old,new,1)
              changed=True
          s=s.replace('openImagePreviewFinal(file.id)','openImagePreviewDirect(file.id)',1)
          if changed:
              p.write_text(s,encoding='utf-8')
          else:
              print('openFile already repaired; no file change needed')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-open-direct.yml
          git commit -m "Fix image opening and remove repair workflow"
          git push
