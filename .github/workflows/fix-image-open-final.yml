name: Fix image open final
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="image-preview-final"' not in s:
              patch = r'''
          <style id="image-preview-final">
          .image-preview-final{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:18px;animation:fadeIn .2s ease}
          .image-preview-final img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:14px}
          .image-preview-final-close{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;z-index:2}
          </style>
          <script id="image-preview-final-js">
          async function openImagePreviewFinal(id){
            try{
              const file=data.files.find(f=>f.id===id);
              if(!file||file.trashed)return;
              const blob=await loadBlob(id);
              if(!blob){showToast('Image not found');return;}
              const old=document.getElementById('imagePreviewFinal');
              if(old)old.remove();
              const url=URL.createObjectURL(blob);
              const box=document.createElement('div');
              box.id='imagePreviewFinal';
              box.className='image-preview-final';
              const close=document.createElement('button');
              close.className='image-preview-final-close';
              close.type='button';
              close.textContent='×';
              close.setAttribute('aria-label','Close');
              const img=document.createElement('img');
              img.src=url;
              img.alt=file.name;
              const closePreview=()=>{URL.revokeObjectURL(url);box.remove()};
              close.onclick=closePreview;
              box.onclick=e=>{if(e.target===box)closePreview()};
              box.appendChild(close);
              box.appendChild(img);
              document.body.appendChild(box);
            }catch(e){console.error(e);showToast('Could not open image')}
          }
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>',1)
          handler = 'row.querySelector(".delete-btn").onclick=()=>deleteFile(file.id);'
          if 'openImagePreviewFinal(file.id)' not in s:
              if handler in s:
                  addition = handler + r'''
          if(/\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){
            row.style.cursor='pointer';
            row.addEventListener('click',e=>{if(e.target.closest('button'))return;openImagePreviewFinal(file.id)});
          }'''
                  s=s.replace(handler,addition,1)
              else:
                  pattern=r'(row\.querySelector\(["\']\.delete-btn["\']\)\.onclick\s*=\s*\(\)\s*=>\s*deleteFile\(file\.id\)\s*;)'
                  s,n=re.subn(pattern,r"\1\n          if(/\\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)){row.style.cursor='pointer';row.addEventListener('click',e=>{if(e.target.closest('button'))return;openImagePreviewFinal(file.id)});}",s,count=1)
                  if n==0:
                      raise SystemExit('Could not find delete handler in index.html')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix image tap preview"
            git push
          fi